// Archived from contracts/api/proto/tap.proto (commit e7d6004): the pool lease RPCs. Numbers/names reserved in the live proto.

message AcquireRequest {
  string run_id = 1;
  // The serials to lease, all at once: the call blocks until every one of them is free or the
  // deadline passes (DEADLINE_EXCEEDED). Which device plays which part in a test is the
  // client's business; the service only knows serials.
  repeated string serials = 4;
  int64 timeout_ms = 3;
  reserved 2;
  reserved "roles";
}

message AcquireResponse {
  repeated DeviceFacts devices = 2; // in request order
  reserved 1;
  reserved "assignments";
}

message ReleaseRequest {
  string run_id = 1;
  repeated string serials = 2; // empty = everything the run holds
}

message ReleaseResponse {
  int32 released = 1;
}

// service PoolService had:
//   rpc Acquire(AcquireRequest) returns (AcquireResponse);
//   rpc Release(ReleaseRequest) returns (ReleaseResponse);
// CloseRunResponse had: int32 devices_released = 2;
