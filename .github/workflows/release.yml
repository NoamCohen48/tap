# Full action SHAs intentionally exceed the usual prose line length.
# yamllint disable rule:line-length
name: Release

# A successful main CI run ships its untagged tap.version once. Explicit v* tags
# and manual dispatch are recovery paths; all require green CI for that SHA.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing unified release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: tap-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  resolve:
    name: Validate version and successful main CI
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      python_version: ${{ steps.plan.outputs.python_version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: >-
            ${{ github.event.workflow_run.head_sha || inputs.tag ||
                github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch origin main:refs/remotes/origin/main --tags
          if [ -n "$COMPLETED_SHA" ]; then
            python .github/scripts/prepare_release.py \
              --completed-sha "$COMPLETED_SHA" >> "$GITHUB_OUTPUT"
          else
            python .github/scripts/prepare_release.py \
              --tag "$TAG" >> "$GITHUB_OUTPUT"
          fi

  native:
    name: Native server (${{ matrix.label }})
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-15
            label: macos-aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1
        with:
          java-version: 21
          distribution: graalvm-community
      - id: graal
        run: printf 'home=%s\n' "$JAVA_HOME" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: ./gradlew :host:daemon:nativeCompile
        env:
          GRAALVM_HOME: ${{ steps.graal.outputs.home }}
      - name: Smoke the native server without a device
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          case "$LABEL:$(uname -m)" in
            linux-x86_64:x86_64|macos-aarch64:arm64) ;;
            *) echo "Runner architecture does not match $LABEL"; exit 1 ;;
          esac
          tap=host/daemon/build/native/nativeCompile/tap
          test "$("$tap" version)" = "tap daemon $VERSION"
          python -m pip install --quiet clients/python
          "$tap" start
          trap '"$tap" stop' EXIT
          python .github/scripts/daemon_smoke.py
          mkdir -p build/assets
          cp "$tap" "build/assets/tap-$VERSION-$LABEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-native-${{ matrix.label }}
          path: build/assets/*
          if-no-files-found: error

  jvm:
    name: JVM server and all Maven artifacts
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Test and stage, without publishing
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          ./gradlew :contracts:protocol:test :host:core:test :host:daemon:test \
            :clients:kotlin:sdk:test :clients:kotlin:junit5:test \
            :host:daemon:distZip :contracts:schema:publishToMavenLocal \
            :contracts:api:publishToMavenLocal \
            :clients:kotlin:sdk:publishToMavenLocal \
            :clients:kotlin:junit5:publishToMavenLocal \
            :device:sync-sdk:publishToMavenLocal \
            -Dmaven.repo.local="$PWD/build/release-maven"
          mkdir -p build/assets
          cp "host/daemon/build/distributions/tap-$VERSION.zip" \
            "build/assets/tap-$VERSION-server-jvm.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-jvm
          path: build/assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-maven
          path: build/release-maven
          if-no-files-found: error

  python:
    name: Python package (${{ matrix.project }})
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [python, agent, studio, watcher]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.project == 'studio' || matrix.project == 'watcher'
        with:
          bun-version: "1.3.11"
          no-cache: true
      - name: Test and build wheel and sdist
        env:
          PROJECT: ${{ matrix.project }}
          VERSION: ${{ needs.resolve.outputs.python_version }}
        run: |
          generator=$(sed -n 's/^GENERATOR_VERSION = "\(.*\)"$/\1/p' \
            clients/python/scripts/gen_stubs.py)
          python -m pip install --quiet build "grpcio-tools==$generator" \
            "clients/python[dev]" "clients/${PROJECT}[dev]"
          case "$PROJECT" in
            python)
              python clients/python/scripts/gen_stubs.py --check
              python -m pytest -q clients/python/tests/unit
              package=tap_e2e ;;
            agent)
              python -m pytest -q clients/agent/tests
              package=tap_agent ;;
            studio|watcher)
              (cd "clients/$PROJECT/web" && bun install --frozen-lockfile)
              python "clients/$PROJECT/scripts/gen_protos.py" --check
              (cd "clients/$PROJECT/web" && bun run test && bun run build)
              python -m pytest -q "clients/$PROJECT/tests"
              package="tap_$PROJECT" ;;
          esac
          # Build the wheel from the sdist too: both must be installable.
          python -m build --outdir build/assets "clients/$PROJECT"
          wheel="build/assets/${package}-${VERSION}-py3-none-any.whl"
          python -m pip install --quiet --force-reinstall --no-deps "$wheel"
          python -c "import importlib.metadata as m; \
            assert m.version('$package') == '$VERSION'"
          case "$PROJECT" in
            agent) tap-agent --help > /dev/null ;;
            studio|watcher) "tap-$PROJECT" --version ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-python-${{ matrix.project }}
          path: build/assets/*
          if-no-files-found: error

  docs:
    name: Documentation from the release commit
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: ./.github/actions/build-docs
        with:
          cache-disabled: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-docs
          path: build/docs-md
          if-no-files-found: error

  assemble:
    name: Verify and assemble all downloads
    needs: [resolve, native, jvm, python, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-native-*
          merge-multiple: true
          path: build/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-jvm
          path: build/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-python-*
          merge-multiple: true
          path: build/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-maven
          path: build/release-maven
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-docs
          path: build/docs-md
      - name: Build platform bundles and verify every version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          scripts/build-bundle.sh --version "$VERSION" --assets build/assets \
            --maven build/release-maven --docs build/docs-md --out build/release
          (cd build/release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-complete
          path: build/release/*
          if-no-files-found: error

  publish:
    name: Publish one complete release
    needs: [resolve, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-complete
          path: build/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-maven
          path: build/release-maven
      - name: Stage a draft (never replace a published release)
        run: python .github/scripts/stage_release.py
      - name: Publish the staged Maven files unchanged
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python .github/scripts/publish_maven.py --version "$VERSION"
          --maven build/release-maven
      - name: Prepare Python distributions
        if: vars.PUBLISH_TO_PYPI == 'true'
        run: |
          mkdir -p build/pypi
          cp build/release/*.whl build/release/*.tar.gz build/pypi/
      - name: Publish Python packages to PyPI
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: build/pypi
          skip-existing: true
      - name: Publish only after every asset and registry upload succeeds
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
      - name: Verify public download URLs
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for file in build/release/*; do
            curl --fail --silent --show-error --location --head \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "$base/$(basename "$file")" > /dev/null
          done
      - name: Deploy website links only after downloads are public
        run: gh workflow run Docs --ref main
