name: Docs

# Builds the public documentation (docs/ + generated Kotlin, Python and gRPC references) with
# scripts/build-docs.sh in two editions, both uploaded as workflow artifacts on every run:
#   site     the website (build/site), also deployed to GitHub Pages from main once Pages is
#            enabled (Settings → Pages → Source: GitHub Actions) and DEPLOY_DOCS=true is set
#   docs-md  tap-docs-md.zip: the same guide and references as plain Markdown files
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, scripts/build-docs.sh, clients/**, contracts/api/**, CHANGELOG.md, build-logic/**, build.gradle.kts, .github/workflows/docs.yml, .github/actions/build-docs/**]
  pull_request:
    paths: [docs/**, mkdocs.yml, scripts/build-docs.sh, clients/**, contracts/api/**, CHANGELOG.md, build-logic/**, build.gradle.kts, .github/workflows/docs.yml, .github/actions/build-docs/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-docs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-md
          path: build/tap-docs-md.zip
      - if: github.event_name != 'pull_request' && vars.DEPLOY_DOCS == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && vars.DEPLOY_DOCS == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
