# yamllint disable rule:line-length
name: Docs

# Builds the public documentation (docs/ + generated Kotlin, Python and gRPC references) with
# scripts/build-docs.sh in two editions, both uploaded as workflow artifacts on every run:
#   site     the website (build/site), also deployed to GitHub Pages from main once Pages is
#            enabled (Settings → Pages → Source: GitHub Actions) and DEPLOY_DOCS=true is set
#   docs-md  tap-docs-md.zip: the same guide and references as plain Markdown files
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/build-docs.sh
      - clients/**
      - contracts/api/**
      - CHANGELOG.md
      - build-logic/**
      - build.gradle.kts
      - gradle.properties
      - .github/workflows/docs.yml
      - .github/actions/build-docs/**
      - .github/scripts/site_release.py
      - .github/scripts/prepare_release.py
      - .github/scripts/release_version.py
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/build-docs.sh
      - clients/**
      - contracts/api/**
      - CHANGELOG.md
      - build-logic/**
      - build.gradle.kts
      - gradle.properties
      - .github/workflows/docs.yml
      - .github/actions/build-docs/**
      - .github/scripts/site_release.py
      - .github/scripts/prepare_release.py
      - .github/scripts/release_version.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/build-docs
      - name: Downloads must exist before deploying the website
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/site_release.py >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: build/site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-md
          path: build/tap-docs-md.zip
      - if: github.event_name != 'pull_request' && vars.DEPLOY_DOCS == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.event_name != 'pull_request' && vars.DEPLOY_DOCS == 'true' &&
      needs.build.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
