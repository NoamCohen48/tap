name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # The tap.v1 API: the proto must lint, must stay wire-compatible with the base
  # branch, and the committed Python stubs must match it. This is the cheap job
  # that fails first when a contract change is wrong.
  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint contracts/proto
      - name: buf breaking (against the base branch)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = \
          "0000000000000000000000000000000000000000" ]; then
            echo "no base commit; skipping"; exit 0
          fi
          if ! git cat-file -e "$BASE:contracts/proto/buf.yaml" 2>/dev/null; then
            echo "base $BASE has no tap.v1 API; skipping"; exit 0
          fi
          # contracts/proto/BREAKING_BASELINE names the last commit of a previous,
          # deliberately incompatible API line (0.x only). A base on or before it
          # is not comparable.
          BASELINE=$(grep -v '^#' contracts/proto/BREAKING_BASELINE 2>/dev/null \
          | head -1 || true)
          if [ -n "$BASELINE" ] && git merge-base --is-ancestor "$BASE" \
          "$BASELINE"; then
            echo "base $BASE predates the API baseline $BASELINE; skipping"; \
            exit 0
          fi
          buf breaking contracts/proto --against \
          ".git#ref=$BASE,subdir=contracts/proto"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python stubs are current
        run: |
          python -m pip install --quiet "grpcio-tools==$(sed -n \
          's/^GENERATOR_VERSION = "\(.*\)"$/\1/p' \
          clients/python/scripts/gen_stubs.py)"
          python clients/python/scripts/gen_stubs.py --check

  # Everything that compiles and tests on the JVM without a device, plus the
  # artifacts every release is made of (driver APKs, daemon distribution, Maven
  # POMs, validation executable).
  jvm:
    name: JVM build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: >
          ./gradlew
          :contracts:protocol:test :host:core:test :host:daemon:test
          :device:driver:command-engine:test :device:driver:core:test
          :device:driver:core:lint :clients:kotlin:sdk:test
          :clients:kotlin:junit5:test
      - name: Assemble driver, fixture, daemon and validation
        run: >
          ./gradlew
          :device:driver:assembleDebug :device:driver:assembleAndroidTest
          :fixture-app:assembleDebug :host:daemon:installDist
          :host:daemon:distZip
          :host:validation:installDist
      - name: Publish Maven artifacts to the local repository (POM sanity)
        run: >
          ./gradlew
          :contracts:schema:publishToMavenLocal
          :contracts:api:publishToMavenLocal
          :clients:kotlin:sdk:publishToMavenLocal
          :clients:kotlin:junit5:publishToMavenLocal
          :device:sync-sdk:publishToMavenLocal
      - name: Daemon version matches gradle.properties
        run: |
          expected=$(sed -n 's/^tap.version.engine=//p' gradle.properties)
          actual=$(host/daemon/build/install/tap/bin/tap version)
          echo "$actual"; [ "$actual" = "tap daemon $expected" ]
      - uses: actions/upload-artifact@v4
        with:
          name: tap-daemon-jvm
          path: host/daemon/build/distributions/tap-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests"
          if-no-files-found: ignore

  # tap-e2e (the Python client) and tap-agent (the agent CLI + MCP server on
  # it): unit tests over the in-process fake daemon, wheels for both.
  python:
    name: Python client and tap-agent (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and build
        run: |
          python -m pip install --quiet build "clients/python[dev]" \
            "clients/agent[dev]"
          python -c "import tap_e2e; print('tap-e2e', tap_e2e.__version__)"
          python -c "import tap_agent; print('tap-agent', tap_agent.__version__)"
          tap-agent --help > /dev/null
          python -m build --outdir dist clients/python
          python -m build --outdir dist clients/agent
      - name: Unit tests (fake daemon, no device)
        run: python -m pytest -q clients/python/tests/unit clients/agent/tests
      - name: >-
          Plugin loads (the sample suite itself needs a device and the fixture
          APK)
        run: >-
          python -c
          "import tap_e2e.pytest_plugin, tap_e2e._gen.device_pb2_grpc"
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: python-dists
          path: dist/*

  # tap-studio: its generated code matches proto/studio.proto, the page (Bun, TypeScript 7)
  # type-checks, passes its tests and builds, the back end passes its tests, and the wheel
  # carries the built page.
  studio:
    name: tap-studio (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          (cd clients/studio/web && bun install --frozen-lockfile)
          python -m pip install --quiet build clients/python \
            "clients/studio[dev]"
      - name: Generated code is current
        run: python clients/studio/scripts/gen_protos.py --check
      - name: Page (type check, tests, build)
        working-directory: clients/studio/web
        run: |
          bun run test
          bun run build
      - name: Back-end unit tests
        run: python -m pytest -q clients/studio/tests
      - name: Wheel carries the page
        run: |
          python -m build --outdir dist clients/studio
          python -m zipfile -l dist/tap_studio-*.whl | \
            grep -q "tap_studio/static/index.html"
          python -m pip install --quiet --force-reinstall --no-deps \
            dist/tap_studio-*.whl
          tap-studio --version
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: studio-dists
          path: dist/*

  # Real-device proof on an API 34 emulator: the fixture-test sample suites
  # (Kotlin + Python) through an auto-started daemon, then a tap-agent session
  # (attach, snapshot, tap by ref, export) checked against its JSON export, then
  # tap-studio from the studio job's wheel (record, export, reopen, replay).
  # One serial, so the two-device tests are skipped.
  # It waits only for the jobs that finish in under a minute (and the studio
  # wheel it installs), not for the JVM job: it builds what it runs itself, and
  # the two are the slowest jobs, so running them side by side is what keeps
  # the whole run short.
  device-tests:
    name: Device tests (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [api-contract, studio]
    steps:
      # The API 34 image plus the AVD's userdata partition need room (the
      # emulator aborts with "Not enough space to create userdata partition").
      # Current runners have ~90 GB free; only clear unused toolchains (~40 s)
      # on a runner that does not.
      - name: Free disk space (only when short)
        run: |
          df -h / | tail -1
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$free_gb" -lt 30 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
              /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
              /usr/local/share/boost 2>/dev/null || true
            sudo docker image prune --all --force >/dev/null 2>&1 || true
            df -h / | tail -1
          fi
      - name: Enable KVM
        run: |
          rule='KERNEL=="kvm", GROUP="kvm", MODE="0666", '
          rule+='OPTIONS+="static_node=kvm"'
          printf '%s\n' "$rule" | sudo tee \
            /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build what the device run needs
        run: ./gradlew :fixture-app:assembleDebug :host:daemon:installDist
      - uses: actions/download-artifact@v4
        with:
          name: studio-dists
          path: studio-dists
      - name: Install the Python client, tap-agent and tap-studio
        run: |
          python -m pip install --quiet "clients/python[dev]" "clients/agent"
          python -m pip install --quiet studio-dists/tap_studio-*.whl
      - name: Run the device lane on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 2G
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          disable-animations: false
          # Each line of `script` runs as its own `sh -c`: keep it one command.
          script: .github/scripts/device-tests.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: device-test-artifacts
          path: |
            samples/fixture-tests/build/tap-artifacts
            tap-artifacts
            build/agent-smoke
            build/studio-smoke
            build/device-logs
            samples/fixture-tests/build/reports/tests
          if-no-files-found: ignore

  # The native image is what `daemon/v*` releases ship; build it on main so a
  # new reflective dependency (missing native-image metadata) is caught before
  # a release.
  native-image:
    name: Native image (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request'
    needs: [jvm]
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 21
          distribution: graalvm-community
      - name: Keep GraalVM for native-image only; Gradle compiles with JDK 17
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :host:daemon:nativeCompile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke (every RPC that needs no device, on the native daemon)
        run: |
          tap=host/daemon/build/native/nativeCompile/tap
          "$tap" version
          python -m pip install --quiet clients/python
          "$tap" start
          trap '"$tap" stop' EXIT
          "$tap" status
          python .github/scripts/daemon_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: tap-daemon-linux-x86_64
          path: host/daemon/build/native/nativeCompile/tap
          if-no-files-found: error
