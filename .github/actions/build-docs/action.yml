# yamllint disable rule:line-length
name: Build docs
description: >-
  Builds the public documentation with scripts/build-docs.sh: the site (build/site) and the
  Markdown bundle (build/docs-md, build/tap-docs-md.zip). Run after actions/checkout.
inputs:
  cache-disabled:
    description: Disable shared Gradle caches when building release artifacts
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1
      with:
        setup_only: true
    - name: protoc-gen-doc
      shell: bash
      run: |
        curl -fsSL https://github.com/pseudomuto/protoc-gen-doc/releases/download/v1.5.1/protoc-gen-doc_1.5.1_linux_amd64.tar.gz \
          | tar -xz -C /usr/local/bin protoc-gen-doc
    - name: Python deps
      shell: bash
      run: python -m pip install --quiet -r docs/requirements.txt -e "clients/python[dev]" -e clients/agent
    - name: Build
      shell: bash
      run: scripts/build-docs.sh
