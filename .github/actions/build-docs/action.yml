name: Build docs
description: >-
  Builds the public documentation with scripts/build-docs.sh: the site (build/site) and the
  Markdown bundle (build/docs-md, build/tap-docs-md.zip). Run after actions/checkout.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: bufbuild/buf-action@v1
      with:
        setup_only: true
    - name: protoc-gen-doc
      shell: bash
      run: |
        curl -fsSL https://github.com/pseudomuto/protoc-gen-doc/releases/download/v1.5.1/protoc-gen-doc_1.5.1_linux_amd64.tar.gz \
          | tar -xz -C /usr/local/bin protoc-gen-doc
    - name: Python deps
      shell: bash
      run: python -m pip install --quiet -r docs/requirements.txt -e "clients/python[dev]" -e clients/agent
    - name: Build
      shell: bash
      run: scripts/build-docs.sh
