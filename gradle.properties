org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# One release version for every component (see .docs/release-engineering.md).
# Python package metadata mirrors this value so each sdist remains self-contained;
# .github/scripts/release_version.py checks those mirrors on every CI run.
tap.version=0.1.0

# Dokka Gradle plugin v2
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
