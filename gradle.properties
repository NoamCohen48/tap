org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Release versions (see .docs/release-engineering.md). Each line is one independently
# released artifact family; CI refuses a release tag whose version differs from these.
#   engine        -> tap service binary/dist (bundles the driver), tap-api Maven artifact,
#                    driver/host build ids in the TAP1 handshake
#   client.kotlin -> tap-client and tap-junit5 Maven artifacts
#   sync-sdk      -> tap-sync-sdk AAR (shipped inside apps under test)
# The Python client's version lives in clients/python/pyproject.toml.
tap.version.engine=0.1.0
tap.version.client.kotlin=0.2.0
tap.version.sync-sdk=0.1.0

# Dokka Gradle plugin v2
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
