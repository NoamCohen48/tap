// tap.studio.v1 — Tap Studio: the page's API (served by `tap-studio` over Connect) and the
// `tap-recording/2` document (Studio can also open legacy /1 files).
//
// The one contract between the studio's Python back end and its TypeScript page: both sides are
// generated from this file (clients/studio/scripts/gen_protos.py). It imports tap.v1 from
// contracts/proto, so selectors, commands and errors are the daemon's own messages, typed on both
// sides. This is a client's contract, not the daemon's: nothing under host/ reads it.
syntax = "proto3";

package tap.studio.v1;

import "command.proto";
import "device.proto";
import "event_log.proto";
import "failure.proto";
import "google/protobuf/timestamp.proto";
import "selector.proto";

service StudioService {
  // What this studio is.
  rpc Info(InfoRequest) returns (InfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The attached device and whether steps are being recorded.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The devices the daemon sees. UNAVAILABLE when no daemon runs (`tap start`).
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // This tab's view of the session: the current state at once, then on every change and at least
  // every second. One tab controls Studio; while its stream is open no other tab can change
  // anything unless it takes control. When the controlling tab's stream ends, control passes to
  // the tab that opened its stream last, so a reloaded page gets control back.
  rpc WatchSession(WatchSessionRequest) returns (stream WatchSessionResponse);
  // Moves control to this tab. FAILED_PRECONDITION while an operation runs: a transfer never
  // interrupts accepted work, and for a tab with no open WatchSession stream.
  rpc TakeControl(TakeControlRequest) returns (TakeControlResponse);
  // Attaches a device, releasing the one attached before. It names no app: app steps carry
  // their package, and the page keeps the one its App menu acts on.
  rpc Attach(AttachRequest) returns (AttachResponse);
  // Puts a quarantined device back in service once the person checked it (tap.v1 Unquarantine):
  // the server retries its cleanup first and says what is still off. Not while it is attached.
  rpc Unquarantine(UnquarantineRequest) returns (UnquarantineResponse);
  // Releases the attached device; open frame streams end.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  // The attached device's screen: a frame whenever one is taken, newest only (a slow reader skips
  // frames). Frames are taken only while a stream is open, never while a Perform or Count is
  // waiting, fast while the screen changes and slower while it does not. Ends when the device is
  // released; FAILED_PRECONDITION without one.
  rpc Frames(FramesRequest) returns (stream FramesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // How many nodes a selector matches now (the inspector's live count).
  rpc Count(CountRequest) returns (CountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // What the one node a selector matches offers: its accessibility actions and its range, so the
  // page offers only the actions and progress values it can take. NOT_FOUND / FAILED_PRECONDITION
  // when the selector does not match exactly one node.
  rpc DescribeElement(DescribeElementRequest) returns (DescribeElementResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The device as it is now (the Device tab's read-back): its settings and the resumed activity.
  rpc GetDeviceStatus(GetDeviceStatusRequest) returns (GetDeviceStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The active notifications, newest first, to pick one to wait for, open or dismiss. The daemon
  // gives the driver notification access for the attachment (taken back on release).
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  // Runs one step on the attached device and, while recording, adds it when it passed.
  rpc Perform(PerformRequest) returns (PerformResponse);
  // Adds a step without running it, whether recording is on or not: a wait or check for a screen
  // that is not here yet. Checked as Perform's step; it has no outcome until it runs.
  // FAILED_PRECONDITION with no device attached and no recording to add to.
  rpc AddStep(AddStepRequest) returns (AddStepResponse);
  // Replaces a recorded step without running it. NOT_FOUND for an unknown id.
  rpc UpdateStep(UpdateStepRequest) returns (UpdateStepResponse);
  // Removes a recorded step.
  rpc DeleteStep(DeleteStepRequest) returns (DeleteStepResponse);
  // Moves a recorded step.
  rpc MoveStep(MoveStepRequest) returns (MoveStepResponse);
  // Adds a copy of a step right after it, with a new id and no outcome. Nothing runs.
  rpc DuplicateStep(DuplicateStepRequest) returns (DuplicateStepResponse);
  // Takes back the last change to the recording, or brings it back. The recording only: what ran
  // on the device stays done. A step keeps its outcome only if the current recording has the same
  // step, unchanged, with one. FAILED_PRECONDITION with nothing to undo or redo.
  rpc UndoRecording(UndoRecordingRequest) returns (UndoRecordingResponse);
  rpc RedoRecording(RedoRecordingRequest) returns (RedoRecordingResponse);
  // Replaces the recording's parameters, whatever is attached. INVALID_ARGUMENT for a bad name, or
  // for removing one a step uses. A changed value clears the outcome of the steps that use it.
  rpc SetParameters(SetParametersRequest) returns (SetParametersResponse);
  // Replaces the recording with a /1 or /2 document to continue or replay; /1 upgrades to /2.
  // INVALID_ARGUMENT lists every rule the document breaks.
  rpc OpenRecording(OpenRecordingRequest) returns (OpenRecordingResponse);
  // Runs recorded steps in order on the attached device, stopping after the first that fails; each
  // step's outcome is kept in the recording. Cancelling the call stops after the running step
  // (a sent command is never interrupted). While it runs, Perform, the step edits, OpenRecording
  // and NewRecording are FAILED_PRECONDITION, and so is a replay for another app than the one
  // attached, or with a secret whose value the studio does not have.
  rpc Replay(ReplayRequest) returns (stream ReplayResponse);
  // The recording as a pytest file on tap-e2e's public API. NOT_FOUND before anything is recorded;
  // FAILED_PRECONDITION for a recording it cannot write without changing what it does.
  rpc ExportPytest(ExportPytestRequest) returns (ExportPytestResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The last replays of this process, newest first, without their steps.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // One run's results. NOT_FOUND once it is no longer kept.
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Record or pause: paused, Perform still runs steps but records nothing.
  rpc SetRecording(SetRecordingRequest) returns (SetRecordingResponse);
  // Discards the recording and starts an empty one.
  rpc NewRecording(NewRecordingRequest) returns (NewRecordingResponse);
  // The recording in progress. NOT_FOUND before anything is recorded.
  rpc GetRecording(GetRecordingRequest) returns (GetRecordingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The private library of named recordings on this machine. These need no device and no Tap
  // server. Definitions only: no outcomes and no secret values. NOT_FOUND for an unknown id, ABORTED
  // when another Studio changed the entry since `revision` was read, ALREADY_EXISTS for a name in
  // use, RESOURCE_EXHAUSTED over a limit.
  rpc ListLibrary(ListLibraryRequest) returns (ListLibraryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Saves the recording: over the entry it came from, or as a new one with `as_new` (or when it came
  // from none, and then `name` is required). FAILED_PRECONDITION with no recording.
  rpc SaveToLibrary(SaveToLibraryRequest) returns (SaveToLibraryResponse);
  // Replaces the recording with an entry. This cannot be undone: earlier versions of the recording
  // would otherwise be saved over this entry. Secrets have no values until given.
  rpc OpenFromLibrary(OpenFromLibraryRequest) returns (OpenFromLibraryResponse);
  rpc RenameInLibrary(RenameInLibraryRequest) returns (RenameInLibraryResponse);
  // The recording in progress stays, no longer saved anywhere.
  rpc DeleteFromLibrary(DeleteFromLibraryRequest) returns (DeleteFromLibraryResponse);
  // Saves every change of a recording that has been saved, a moment after it happens, until turned
  // off or the recording is replaced. FAILED_PRECONDITION when it has not been saved. A failure
  // turns it off and says why in the session's `library`. Not an execution journal: a recovered
  // file says nothing about what ran on the device.
  rpc SetAutosave(SetAutosaveRequest) returns (SetAutosaveResponse);
  // Explicit one-shot reads; never recorded. PROCESS can wait for a process identity.
  rpc QueryApp(QueryAppRequest) returns (QueryAppResponse);
  // SDK private data tools, never recorded. Browser transfers are capped at 1 MiB total;
  // larger files/bundles need the SDK's streaming surface, not this unary browser endpoint.
  rpc PrivateData(PrivateDataRequest) returns (PrivateDataResponse);
  // Explicit download of SDK diagnostics/metadata, at most 1 MiB. Not selector input.
  rpc ExportDiagnostic(DiagnosticRequest) returns (DiagnosticResponse);
}

// ---- the library -------------------------------------------------------------------------------

message LibraryEntry {
  string id = 1;
  string name = 2;
  int64 revision = 3;
  google.protobuf.Timestamp updated_at = 4;
  int32 steps = 5;
}

message ListLibraryRequest {}

message ListLibraryResponse {
  // Newest first.
  repeated LibraryEntry entries = 1;
  // Files that could not be read; they are left in place.
  int32 unreadable = 2;
}

message SaveToLibraryRequest {
  // Required for a new entry; otherwise absent keeps its name.
  optional string name = 1;
  bool as_new = 2;
}

message SaveToLibraryResponse {
  Session session = 1;
}

message OpenFromLibraryRequest {
  string id = 1;
}

message OpenFromLibraryResponse {
  Session session = 1;
  Recording recording = 2;
  repeated string missing_secrets = 3;
}

message RenameInLibraryRequest {
  string id = 1;
  string name = 2;
  int64 revision = 3;
}

message RenameInLibraryResponse {
  Session session = 1;
}

message DeleteFromLibraryRequest {
  string id = 1;
  int64 revision = 2;
}

message DeleteFromLibraryResponse {
  Session session = 1;
}

message SetAutosaveRequest {
  bool enabled = 1;
}

message SetAutosaveResponse {
  Session session = 1;
}

// ---- explicit, non-recorded SDK tools -----------------------------------------------------------
// These operate only on Studio's own attached device. They never become replay steps.
enum AppQuery {
  APP_QUERY_UNSPECIFIED = 0;
  APP_QUERY_INSTALLED = 1;
  APP_QUERY_RUNNING = 2;
  APP_QUERY_PROCESS = 3;
  APP_QUERY_LOCALES = 4;
  APP_QUERY_PERMISSION = 5;
}
message QueryAppRequest {
  string package_name = 1;
  AppQuery query = 2;
  string permission = 3;
  // Only PROCESS accepts an explicit 1..120000 ms budget.
  optional int64 timeout_ms = 4;
}
message QueryAppResponse { string json = 1; }

enum PrivateDataOperation {
  PRIVATE_DATA_OPERATION_UNSPECIFIED = 0;
  PRIVATE_DATA_CAPABILITIES = 1;
  PRIVATE_DATA_LIST = 2;
  PRIVATE_DATA_READ = 3;
  PRIVATE_DATA_WRITE = 4;
  PRIVATE_DATA_DELETE = 5;
  PRIVATE_DATA_EXPORT_DATABASE = 6;
  PRIVATE_DATA_IMPORT_DATABASE = 7;
}
// An opaque portable bundle, not SQL. Optional WAL/journal retain presence, even when empty.
message DatabaseBundle {
  // Exactly "tap-studio-database/1"; not a recording or a shared SDK interchange format.
  string format = 1;
  string name = 2;
  bytes database = 3;
  optional bytes wal = 4;
  optional bytes journal = 5;
}
message PrivateDataRequest {
  string package_name = 1;
  PrivateDataOperation operation = 2;
  string path = 3;
  // Export basename, or optional import destination basename.
  string name = 4;
  bytes data = 5;
  DatabaseBundle bundle = 6;
  // WRITE / IMPORT only; defaults to refusing replacement.
  bool overwrite = 7;
  // WRITE / DELETE / IMPORT require explicit confirmation. Still checked by the daemon;
  // no implicit stop, launch, restore or retry. Except capabilities, the whole UID must be stopped.
  bool confirmed = 8;
  // READ / WRITE / EXPORT / IMPORT only, 1..120000 ms.
  optional int64 timeout_ms = 9;
}
message PrivateDataResponse {
  // Metadata/status only, never file bytes or paths in a recording.
  string json = 1;
  bytes data = 2;
  DatabaseBundle bundle = 3;
}

enum DiagnosticKind {
  DIAGNOSTIC_UNSPECIFIED = 0;
  DIAGNOSTIC_SCREENSHOT = 1;
  DIAGNOSTIC_HIERARCHY = 2;
  DIAGNOSTIC_DEVICE_LOGS = 3;
  DIAGNOSTIC_DRIVER_LOG = 4;
  DIAGNOSTIC_EVENTS = 5;
  DIAGNOSTIC_SERVER_INFO = 6;
  DIAGNOSTIC_DEVICE_INFO = 7;
  DIAGNOSTIC_DEVICES = 8;
}
message DiagnosticRequest {
  DiagnosticKind kind = 1;
  // EVENTS only; nonnegative, reports dropped-ring state in the output.
  optional int64 after_seq = 2;
}
message DiagnosticResponse {
  bytes data = 1;
  string filename = 2;
  string content_type = 3;
}

message InfoRequest {}

message InfoResponse {
  // The tool and its version, as a recording's `recorder`.
  string recorder = 1;
  // The recording format this studio writes: "tap-recording/2".
  string format = 2;
}

// ---- session ----------------------------------------------------------------------------------

message AttachedDevice {
  string serial = 1;
  int32 api_level = 2;
  string manufacturer = 3;
  string model = 4;
  int32 display_width = 5;
  int32 display_height = 6;
  // Attached to inspect it (`AttachRequest.inspect_quarantined`): why it is quarantined. It stays
  // quarantined after Release until Unquarantine.
  string quarantine_reason = 7;
}

message Session {
  // Absent when no device is attached.
  AttachedDevice device = 1;
  // Whether Perform appends the steps that pass.
  bool recording = 2;
  // Steps in the recording.
  int32 steps = 3;
  // The tab that may change anything; every other tab reads. A request names its tab in the
  // `x-tap-studio-tab` header. Empty until a tab watches the session.
  string controller_tab = 4;
  // What Studio is doing and every change waits for: "action", "tool", "attachment", "release",
  // "save" or "replay". It outlives a cancelled request: accepted work finishes first. Empty when idle.
  string operation = 5;
  // Increases with every change of the session, so a late response cannot replace a newer one.
  int64 version = 6;
  // Increases with every change of the recording, including a step's outcome.
  int64 recording_revision = 7;
  bool can_undo = 8;
  bool can_redo = 9;
  // Where the recording is saved in the library, and whether it has changed since.
  LibraryLink library = 10;
}

message LibraryLink {
  // Empty when the recording is not saved in the library.
  string id = 1;
  string name = 2;
  // The entry's revision as last read or written.
  int64 revision = 3;
  // The recording has changed since it was saved or opened.
  bool unsaved = 4;
  bool autosave = 5;
  // Why autosave turned itself off.
  string autosave_error = 6;
}

message GetSessionRequest {}

message GetSessionResponse {
  Session session = 1;
}

message WatchSessionRequest {
  // Random per page load, at most 64 characters.
  string tab = 1;
}

message WatchSessionResponse {
  Session session = 1;
}

message TakeControlRequest {
  string tab = 1;
}

message TakeControlResponse {
  Session session = 1;
}

message ListDevicesRequest {}

message DeviceChoice {
  string serial = 1;
  // DEVICE_FREE and DEVICE_LEASED devices can be attached (a lease held by this studio's own
  // connection or by another client of the same daemon), and DEVICE_QUARANTINED ones with
  // `retry_on_attach`; any other quarantined one only to inspect it.
  tap.v1.DeviceState state = 2;
  // Attached by this studio.
  bool attached = 3;
  // QUARANTINED: why.
  string quarantine_reason = 4;
  // What the device is. Zero and empty when the server could not read it (offline, unauthorized).
  int32 api_level = 5;
  string model = 6;
  bool emulator = 7;
  // QUARANTINED only because settings did not read back: attaching retries them first.
  bool retry_on_attach = 8;
  // QUARANTINED and attached by someone inspecting it.
  bool under_inspection = 9;
}

message ListDevicesResponse {
  repeated DeviceChoice devices = 1;
}

message AttachRequest {
  string serial = 1;
  // Attach a quarantined device to inspect and fix it; it stays quarantined after Release.
  bool inspect_quarantined = 2;
}

message UnquarantineRequest {
  string serial = 1;
}

message UnquarantineResponse {
  // Why it had been quarantined; empty when it was not (nothing was done).
  string quarantine_reason = 1;
  // What the cleanup retry put right, and what it could not.
  repeated string cleaned = 2;
  repeated string remaining = 3;
}

message AttachResponse {
  Session session = 1;
}

message ReleaseRequest {}

message ReleaseResponse {
  Session session = 1;
}

// ---- screen -----------------------------------------------------------------------------------

message FramesRequest {}

// One frame: a screen snapshot and the screenshot taken right after it, so the nodes and the
// picture show the same screen unless it was changing (`moving`).
message FramesResponse {
  // Increases per attached device.
  int64 sequence = 1;
  google.protobuf.Timestamp taken_at = 2;
  // The screenshot, PNG.
  bytes png = 3;
  int32 width = 4;
  int32 height = 5;
  // Quarter turns, from the snapshot.
  int32 rotation = 6;
  // The daemon's snapshot: every node with its ref, bounds and selector candidates.
  int64 snapshot_id = 7;
  repeated tap.v1.ScreenNode nodes = 8;
  // A node was added, removed or moved since the previous frame: the screen may still be changing,
  // so the overlay is provisional. Picture-only changes (a blinking cursor, the clock, a spinner)
  // leave the elements where they are and do not count.
  bool moving = 9;
}

message CountRequest {
  tap.v1.Selector selector = 1;
}

message CountResponse {
  // Capped at 1000, as the driver's count.
  int32 count = 1;
}

message DescribeElementRequest {
  tap.v1.Selector selector = 1;
}

message DescribeElementResponse {
  // The standard accessibility actions the node offers (`Element.performAction`).
  repeated tap.v1.StandardAction actions = 1;
  // The custom actions it offers, by label (`Element.performCustomAction`).
  repeated string custom_actions = 2;
  // A range node's (SeekBar, Slider, RatingBar) range: `Element.setProgress` takes min..max.
  optional tap.v1.Range range = 3;
}

message GetDeviceStatusRequest {}

message GetDeviceStatusResponse {
  tap.v1.DeviceInfo info = 1;
  // The resumed activity (`Device.foregroundActivity`); both absent when none is resumed.
  optional string foreground_package = 2;
  optional string foreground_activity = 3;
}

message ListNotificationsRequest {}

message ListNotificationsResponse {
  repeated tap.v1.DeviceNotification notifications = 1;
}

// ---- steps ------------------------------------------------------------------------------------

message PerformRequest {
  // The step to run. `id` and `outcome` are ignored and an action's `wait` must be absent: the
  // studio sets the id, infers the wait (decision 6), fills in the gesture defaults and measures
  // the outcome.
  Step step = 1;
  // The value of the step's `secret` (a secret set_text or type step, and only then): sent to the
  // device, never written to the recording.
  optional string secret_value = 2;
  // Where a recorded step goes: before this step; empty for the end. NOT_FOUND (and nothing runs)
  // for an unknown id.
  string before_step_id = 3;
  // Run the step but never record it, whether recording is on or not: the page's own probes,
  // such as the scrolls that look for a scroll until's target before the user picks it.
  bool skip_recording = 4;
  // An element action's inferred wait budget, 1..120000 ms. Only with a targeted action;
  // persisted in action.wait.timeout_ms, never treated as the input command's own budget.
  optional int64 precondition_timeout_ms = 5;
}

message PerformResponse {
  // The step as run, with its outcome; its `id` is set when it was recorded.
  Step step = 1;
  // Added to the recording: recording is on and the step passed.
  bool recorded = 2;
  // Why it failed, for a person; empty when it passed.
  string message = 3;
}

message AddStepRequest {
  // As PerformRequest's.
  Step step = 1;
  optional string secret_value = 2;
  string before_step_id = 3;
}

message AddStepResponse {
  Recording recording = 1;
  repeated string missing_secrets = 2;
}

message UpdateStepRequest {
  // The step with the same id is replaced. Checked as Perform's step, except that an action's
  // `wait` is ignored and inferred again from its selector and the id is kept. The outcome is kept
  // when only the note changed and cleared otherwise: the step as edited has not run.
  Step step = 1;
  // The value of the step's secret, remembered for this process. It may be left out: Replay then
  // asks for it (`missing_secrets`).
  optional string secret_value = 2;
}

message UpdateStepResponse {
  Recording recording = 1;
  repeated string missing_secrets = 2;
}

message DeleteStepRequest {
  string step_id = 1;
}

message DeleteStepResponse {
  Recording recording = 1;
  repeated string missing_secrets = 2;
}

message MoveStepRequest {
  string step_id = 1;
  // Moves it before this step; empty for the end.
  string before_step_id = 2;
}

message MoveStepResponse {
  Recording recording = 1;
  repeated string missing_secrets = 2;
}

message DuplicateStepRequest {
  string step_id = 1;
}

message DuplicateStepResponse {
  Recording recording = 1;
  repeated string missing_secrets = 2;
}

message UndoRecordingRequest {}

message UndoRecordingResponse {
  Recording recording = 1;
  repeated string missing_secrets = 2;
}

message RedoRecordingRequest {}

message RedoRecordingResponse {
  Recording recording = 1;
  repeated string missing_secrets = 2;
}

message SetParametersRequest {
  repeated Parameter parameters = 1;
}

message SetParametersResponse {
  Recording recording = 1;
  repeated string missing_secrets = 2;
}

message OpenRecordingRequest {
  // A tap-recording/1 or /2 file. Secrets have no values until UpdateStep or Replay gives them.
  string document = 1;
}

message OpenRecordingResponse {
  Session session = 1;
  Recording recording = 2;
  repeated string missing_secrets = 3;
}

message ReplayRequest {
  // The first step to run; empty for the first of the recording.
  string from_step_id = 1;
  // Run only that step.
  bool only = 2;
  // Values for secrets, remembered for this process as UpdateStep's.
  map<string, string> secret_values = 3;
}

// Two per step: when it starts (no outcome), and when it ends (its outcome). The stream ends after
// the last step or the first failure.
message ReplayResponse {
  string step_id = 1;
  // Absent while the step runs.
  Outcome outcome = 2;
  // Why it failed, for a person; empty when it passed or runs.
  string message = 3;
  // The run this step belongs to (`GetRun`).
  string run_id = 4;
}

message ExportPytestRequest {}

message ExportPytestResponse {
  string source = 1;
}

message ListRunsRequest {}

message ListRunsResponse {
  repeated RunResult runs = 1;
}

message GetRunRequest {
  string id = 1;
}

message GetRunResponse {
  RunResult run = 1;
  // The same run as a JSON file (tap-studio-run/1), to download.
  string document = 2;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 1;
  // Every planned step ran and passed.
  RUN_STATUS_PASSED = 2;
  // A step failed, so the run ended there.
  RUN_STATUS_FAILED = 3;
  // It ended early with no failure: cancelled, interrupted or Studio shut down.
  RUN_STATUS_STOPPED = 4;
}

// What one replay did (tap-studio-run/1), from Studio or `tap-studio replay`. It covers the steps
// that finished and is not an execution journal: it cannot say whether input was sent by a step
// that a crash or interruption cut off.
message RunResult {
  // Exactly "tap-studio-run/1".
  string format = 1;
  string id = 2;
  google.protobuf.Timestamp started_at = 3;
  // Absent while it runs.
  google.protobuf.Timestamp finished_at = 4;
  RunStatus status = 5;
  string serial = 6;
  // How many steps it set out to run, and how many finished.
  int32 planned = 7;
  int32 ran = 8;
  string failed_step_id = 9;
  // The parameter values it ran with. Secrets are never here: known values are also scrubbed from
  // every message, which cannot catch a value the device or app has changed.
  map<string, string> parameters = 10;
  repeated StepResult steps = 11;
  // More steps ran than a result keeps; `ran` still counts them.
  bool truncated = 12;
}

message StepResult {
  string step_id = 1;
  Outcome outcome = 2;
  string message = 3;
}

message SetRecordingRequest {
  bool recording = 1;
}

message SetRecordingResponse {
  Session session = 1;
}

message NewRecordingRequest {}

message NewRecordingResponse {
  Session session = 1;
}

message GetRecordingRequest {}

message GetRecordingResponse {
  Recording recording = 1;
  // The same recording as its tap-recording/2 file (tap_studio.recording.dumps), so the page
  // exports exactly what the back end writes and validates.
  string document = 2;
  // Secrets the steps use whose values the studio does not have (an opened recording): Replay
  // needs them.
  repeated string missing_secrets = 3;
}

// ---- tap-recording/2 ----------------------------------------------------------------------------
//
// The document is this message in proto3 JSON with the original (snake_case) field names, as
// `tap-events/1`. /2 adds explicit type/wait/scroll budgets which /1 readers would silently drop;
// older Studio versions must refuse it. This Studio upgrades /1 documents on open. Rules proto
// cannot state are checked by tap_studio.recording.validate and listed on each field.

message Recording {
  // Exactly "tap-recording/2" when written; legacy /1 is upgraded on open.
  string format = 1;
  // When recording started.
  google.protobuf.Timestamp recorded_at = 2;
  // The tool and its version, e.g. "tap-studio 0.0.1".
  string recorder = 3;
  // Provenance only: a replay may use any device.
  RecordedDevice device = 4;
  // Every secret name the steps use, each once, so a replayer can ask for all of them up front.
  repeated string secrets = 6;
  repeated Step steps = 7;
  // Test data a step can name instead of holding it, unique by name. Written to the file, so never
  // a secret: use `secrets` for those.
  repeated Parameter parameters = 8;
}

// A named value. It stands for text a step types or expects, resolved before anything runs. A
// parameter is never part of a selector, and it is text, not a template: "${x}" in a step's own
// text is just those characters.
message Parameter {
  // A letter or "_", then letters, digits or "_"; at most 64. Not also the name of a secret.
  string name = 1;
  // At most 4096 characters; may be empty.
  string value = 2;
  optional string description = 3;
}

message RecordedDevice {
  string serial = 1;
  optional int32 api_level = 2;
  optional string manufacturer = 3;
  optional string model = 4;
}

// Where a step's selector came from.
enum SelectorOrigin {
  SELECTOR_ORIGIN_UNSPECIFIED = 0;
  SELECTOR_ORIGIN_SYNTHESIZED = 1; // the daemon's first choice
  SELECTOR_ORIGIN_ALTERNATIVE = 2; // another candidate the user picked
  SELECTOR_ORIGIN_EDITED = 3; // typed in by the user
}

message Step {
  // Required; unique within the recording and stable across edits; ≤ 64 chars.
  string id = 1;
  optional string note = 2;
  // How the step went the last time it ran; absent if it never ran.
  Outcome outcome = 3;
  // Required.
  oneof kind {
    // An app call: cold_launch, launch, foreground, force_stop, clear_data, grant_permission,
    // revoke_permission, open_link or set_locales (`permission` with the two permission calls
    // only; `activity` and `extras` with the launches only; `uri`, required, and `any_app` with
    // open_link only; `locales` with set_locales only, none = follow the system again).
    tap.v1.AppCall app = 10;
    ActionStep action = 11;
    TypeStep type = 12;
    WaitStep wait = 13;
    AssertionStep assertion = 14;
    ScrollUntilStep scroll_until = 15;
    AppWaitStep app_wait = 16;
    DeviceWaitStep device_wait = 17;
    // A device condition held until the device is released (or the replay's session ends), which
    // restores what the device had: set_animations, set_dark_mode, set_font_scale, set_density,
    // set_network, set_system_locales, set_location, set_stay_awake or set_accessibility_display,
    // with the fields `tap.v1.DeviceCall` lists for each. The file calls (push_file, pull_file,
    // add_media) need a host file and are not steps.
    tap.v1.DeviceCall device = 18;
    DeviceAssertionStep device_assertion = 19;
  }
}

// One command; a command with a selector is preceded by the wait that proved it could run.
message ActionStep {
  // On an element: tap, long_tap, double_tap, multi_tap, hold, set_text, clear_text, scroll, swipe, fling, pinch,
  // drag, perform_ime_action, perform_accessibility_action or set_progress. On the device, with no
  // selector: press_key, open_system_panel, set_orientation, set_display_rotation,
  // unfreeze_rotation, dismiss_keyguard, hide_keyboard, set_clipboard, choose_permission,
  // open_notification or dismiss_notification.
  tap.v1.Command command = 1;
  // For every op on an element (and only then): `wait_visible` of the command's selector, with
  // `exactly_one` unless the selector has a `first` or `at` pick (waits count every match, so a
  // picked selector waits for at least one and the command picks). A replayer sends `wait` then
  // `command`, unchanged.
  tap.v1.Command wait = 2;
  // set_text only: the name of the secret whose value is the text; `set_text.text` is then empty.
  optional string secret = 3;
  // Unspecified for the ops on the device. A drag's destination is its own: resolved by the driver
  // on the same screen, it needs no wait.
  SelectorOrigin selector_origin = 4;
  // set_text only: the name of the parameter whose value is the text; `set_text.text` is then empty.
  optional string parameter = 5;
}

// The element typeText flow, three commands: tap `selector`, await it focused (unless
// `skip_focus_wait`), then `type_text`. The wait before the tap is implied: exactly one match,
// or at least one for a selector with a `first` or `at` pick.
message TypeStep {
  // Required.
  tap.v1.Selector selector = 1;
  // Required.
  oneof input {
    string text = 2;
    // The name of the secret whose value is typed.
    string secret = 3;
    // The name of the parameter whose value is typed.
    string parameter = 9;
  }
  // The SDKs' `await_focus = false`: for fields whose focus lands elsewhere.
  bool skip_focus_wait = 4;
  SelectorOrigin selector_origin = 5;
  // Separate 1..120000 ms budgets for tap/type, initial selector wait, and the focus wait.
  // Absent fields use the SDK defaults; none promises keyboard/IME readiness.
  optional int64 timeout_ms = 6;
  optional int64 precondition_timeout_ms = 7;
  optional int64 focus_timeout_ms = 8;
}

// The SDKs' element waits (`ElementWait`).
enum Condition {
  CONDITION_UNSPECIFIED = 0;
  CONDITION_VISIBLE = 1;
  CONDITION_ONE = 2;
  CONDITION_GONE = 3;
  CONDITION_ENABLED = 4;
  CONDITION_DISABLED = 5;
  CONDITION_CHECKED = 6;
  CONDITION_UNCHECKED = 7;
  CONDITION_FOCUSED = 8;
  CONDITION_TEXT_EQUALS = 9; // value: text
  CONDITION_TEXT_CONTAINS = 10; // value: text
  CONDITION_COUNT = 11; // value: count
}

// A wait: `selector` meets `condition` within the device's wait timeout, replayed as the SDK
// wait of the same name (`screen.await(selector).visible()`).
message WaitStep {
  // Required.
  tap.v1.Selector selector = 1;
  // Required.
  Condition condition = 2;
  // Set exactly for the conditions that take one.
  oneof value {
    string text = 3;
    int32 count = 4; // ≥ 0
    string parameter = 7; // the name of the parameter whose value is the text
  }
  SelectorOrigin selector_origin = 5;
  // 1..120000 ms; absent uses the SDK wait default.
  optional int64 timeout_ms = 6;
}

// What an assertion checks, with the SDKs' element queries, once and at once.
enum Check {
  CHECK_UNSPECIFIED = 0;
  CHECK_EXISTS = 1; // exists(): at least one match
  CHECK_COUNT = 2; // count() == value: count
  CHECK_TEXT_EQUALS = 3; // text() == value: text
  CHECK_TEXT_CONTAINS = 4; // text() contains value: text
  CHECK_ENABLED = 5; // isEnabled()
  CHECK_DISABLED = 6; // !isEnabled()
  CHECK_CHECKED = 7; // isChecked()
  CHECK_UNCHECKED = 8; // !isChecked()
  CHECK_FOCUSED = 9; // snapshot().focused
}

// An assertion: the screen as it is now, with no waiting. One query command (`exists`, `count`, or
// `snapshot` of the one match) whose answer must be `check`; a test writes it as
// `assertTrue(screen.element(selector).exists())`. Wait first (a WaitStep) for a screen that is
// still changing.
message AssertionStep {
  // Required.
  tap.v1.Selector selector = 1;
  // Required.
  Check check = 2;
  // Set exactly for the checks that take one.
  oneof value {
    string text = 3;
    int32 count = 4; // ≥ 0
    string parameter = 7; // the name of the parameter whose value is the text
  }
  SelectorOrigin selector_origin = 5;
  // One query's command budget, 1..120000 ms; not a wait for the assertion to hold.
  optional int64 timeout_ms = 6;
}

// The SDKs' `Element.scrollUntil`: scrolls `container` towards `direction` until `target` exists
// inside it (`container.descendant(target)`, or `target` itself for a container with a pick), at
// most `max_scrolls` times within the device's wait timeout. The container's wait before it is
// implied, as a type step's: exactly one match, or at least one for a selector with a pick.
message ScrollUntilStep {
  // Required: the scrollable element.
  tap.v1.Selector container = 1;
  // Required: what to scroll into view.
  tap.v1.Selector target = 2;
  // Required: the content edge scrolled towards, as `scroll`'s.
  tap.v1.Direction direction = 3;
  // 0..1000; the studio sets 20 (the SDKs' default) when the page leaves it out.
  optional int32 max_scrolls = 4;
  // 1..100; the studio sets 80 (the SDKs' default) when the page leaves it out.
  optional int32 distance_percent = 5;
  // The container's.
  SelectorOrigin selector_origin = 6;
  // Separate 1..120000 ms search and initial container-wait budgets.
  optional int64 timeout_ms = 7;
  optional int64 precondition_timeout_ms = 8;
}

// An app wait, one command on the app's package: `wait_app_visible` (`App.awaitVisible`: the app
// owns the focused window) or `wait_screen_stable` (`App.awaitScreenStable`, or its shorthands
// `awaitSettled` for STABILITY_TREE and `awaitAnimationEnd` for STABILITY_PIXELS). An empty
// wait_screen_stable.package_name watches the whole screen; wait_app_visible requires a package.
message AppWaitStep {
  tap.v1.Command command = 1;
}

// A device wait, one command with no selector: `await_toast` (`Device.awaitToast`),
// `await_notification` (`Device.awaitNotification`) or `wait_permission_prompt`
// (`Device.awaitPermissionPrompt`), within its `timeout_ms` or the device's wait timeout.
message DeviceWaitStep {
  tap.v1.Command command = 1;
}

// What a device assertion checks, once and at once.
enum DeviceCheck {
  DEVICE_CHECK_UNSPECIFIED = 0;
  // foregroundActivity() is `text`, as "package/class" (the class as Android names it).
  DEVICE_CHECK_FOREGROUND_ACTIVITY = 1;
  DEVICE_CHECK_KEYBOARD_SHOWN = 2; // keyboardShown()
  DEVICE_CHECK_KEYBOARD_HIDDEN = 3; // !keyboardShown()
  DEVICE_CHECK_CLIPBOARD_EQUALS = 4; // clipboard() == text
}

// An assertion on the device rather than an element: one query, no waiting.
message DeviceAssertionStep {
  // Required.
  DeviceCheck check = 1;
  // Set exactly for FOREGROUND_ACTIVITY (non-empty, with a "/") and CLIPBOARD_EQUALS.
  optional string text = 2;
}

// At most one of `error`, `failure` and `mismatch`; none means the step passed.
message Outcome {
  int32 duration_ms = 1;
  // The driver's error when a command failed.
  tap.v1.Error error = 2;
  // The call failed as an RPC (an app call, a lost device).
  tap.v1.Failure failure = 3;
  // An assertion's commands ran but its check did not hold: what was found, for a person.
  string mismatch = 4;
}
