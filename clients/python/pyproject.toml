[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-e2e"
version = "0.1.0"
description = "Python client and pytest plugin for the Tap Android E2E host service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
# Lower bounds follow the versions the committed stubs were generated with (scripts/gen_stubs.py).
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.84.0", "pytest>=8"]

[project.entry-points.pytest11]
tap = "tap.pytest_plugin"

[tool.setuptools.packages.find]
include = ["tap", "tap.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
