[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-agent"
version = "0.1.0"
description = "CLI and MCP server for coding agents driving Android devices through the Tap daemon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
# tap-e2e: held connections, resume and screen snapshots arrived after 0.2.0.
# mcp 2.x (the server class is mcp.server.mcpserver.MCPServer); built and tested on 2.2.0.
dependencies = ["tap-e2e>=0.2.0", "mcp>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
tap-agent = "tap_agent.cli:main"

[tool.setuptools.packages.find]
include = ["tap_agent", "tap_agent.*"]

[tool.setuptools.package-data]
tap_agent = ["SKILL.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
