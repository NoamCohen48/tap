# buf (https://buf.build) configuration for the tap.v1 server API.
# CI runs `buf lint` and `buf breaking` against the base branch, so an
# incompatible proto edit (removed or renumbered fields, changed types) fails
# before anyone regenerates stubs.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Files keep short enum prefixes (ERR_, DIR_, …), mirrored by
    # EnumMirrorTest, and live flat under proto/ (see README.md).
    - ENUM_VALUE_PREFIX
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - WIRE_JSON
