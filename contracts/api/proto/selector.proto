// tap.v1 — element selectors.
//
// Part of the Tap host server API (see README.proto for the file map). Mirrors
// protocol/Selector.kt one-to-one: every protocol sum type is a `oneof` here (`Node.kind`,
// `Selector.scope`, `Selector.pick`), so each variant carries exactly its own fields. The
// server converts between the two and `EnumMirrorTest` fails the build if an enum or a
// `oneof` case drifts.

syntax = "proto3";

package tap.v1;

option java_package = "com.company.tap.api.v1";
option java_multiple_files = true;
option java_outer_classname = "SelectorProto";

// How a Match compares; REGEX is RE2 syntax, full match.
enum MatchMode {
  MATCH_UNSPECIFIED = 0; // = MATCH_EXACT
  MATCH_EXACT = 1;
  MATCH_CONTAINS = 2;
  MATCH_STARTS_WITH = 3;
  MATCH_ENDS_WITH = 4;
  MATCH_REGEX = 5;
}

// The string-valued node properties a Match can constrain.
enum TextProperty {
  PROPERTY_UNSPECIFIED = 0; // rejected
  PROPERTY_TEXT = 1;
  PROPERTY_CONTENT_DESCRIPTION = 2;
  PROPERTY_HINT = 3;
  PROPERTY_CLASS_NAME = 4;
}

// The boolean node properties a Flag can constrain.
enum NodeFlag {
  FLAG_UNSPECIFIED = 0; // rejected
  FLAG_ENABLED = 1;
  FLAG_CHECKED = 2;
  FLAG_CHECKABLE = 3;
  FLAG_CLICKABLE = 4;
  FLAG_FOCUSED = 5;
  FLAG_FOCUSABLE = 6;
  FLAG_LONG_CLICKABLE = 7;
  FLAG_SCROLLABLE = 8;
  FLAG_SELECTED = 9;
}

// Which relative a Related constrains.
enum Relation {
  RELATION_UNSPECIFIED = 0; // rejected
  RELATION_PARENT = 1;      // the direct parent matches
  RELATION_ANCESTOR = 2;    // some ancestor matches
  RELATION_CHILD = 3;       // at least one direct child matches
  RELATION_DESCENDANT = 4;  // at least one descendant matches
}

// A string property compared against `value` under `mode`.
message Match {
  TextProperty property = 1;
  string value = 2;
  MatchMode mode = 3;
}

// A boolean property that must equal `value`.
message Flag {
  NodeFlag property = 1;
  bool value = 2;
}

// A resource id. With `package_name`: the View id `package_name:id/name`. With `aut_package`:
// the same, with the session's app under test filled in by the server (so the selector stays
// session-free); mutually exclusive with `package_name`. With neither: the exact, unqualified
// resource name, which is how a Compose testTag appears under testTagsAsResourceId.
message ResourceId {
  string name = 1;
  optional string package_name = 2;
  bool aut_package = 3;
}

// The `relation` of the node must satisfy `node`.
message Related {
  Relation relation = 1;
  Node node = 2;
}

// Conjunction: every operand must hold. At least two operands.
message AllOf {
  repeated Node nodes = 1;
}

// Disjunction: at least one operand must hold. At least two operands. Evaluated by the
// driver's traversal plan rather than a native BySelector.
message AnyOf {
  repeated Node nodes = 1;
}

// One node predicate of the selector expression tree. Limits over the whole tree: depth ≤ 32,
// ≤ 256 nodes, strings ≤ 1024 chars.
message Node {
  oneof kind {
    Match match = 1;
    Flag flag = 2;
    ResourceId resource = 3;
    Related related = 4;
    AllOf all_of = 5;
    AnyOf any_of = 6;
  }
}

// Scope variants: the focused window of the app under test (default), or of an allowlisted
// system package (permission dialogs).
message AutScope {}
message SystemScope {
  string package_name = 1;
}

// Pick variants: exactly one match (default; more is AMBIGUOUS), the first in accessibility
// order, or the zero-based `index`-th in accessibility order (NOT_FOUND when absent).
message ExactlyOne {}
message First {}
message At {
  int32 index = 1;
}

// A complete selector: the node tree, its scope and how an action picks among matches.
// Built by the client DSLs and validated identically by the server and the driver.
message Selector {
  Node node = 1;
  oneof scope {
    AutScope aut = 2;
    SystemScope system = 3;
  }
  oneof pick {
    ExactlyOne exactly_one = 4;
    First first = 5;
    At at = 6;
  }
}
