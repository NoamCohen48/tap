// tap.v1 — element selectors.
//
// Part of the Tap host server API (see README.md for the file map) and of the device wire
// protocol. Every sum type is a `oneof` (`Node.kind`, `Selector.pick`), so
// each variant carries exactly its own fields. Validated by the same code
// (:contracts:protocol CommandValidation) on the server and on the driver.

syntax = "proto3";

package tap.v1;

option java_package = "io.github.noamcohen48.tap.api.v1";
option java_multiple_files = true;
option java_outer_classname = "SelectorProto";

// How a Match compares; REGEX is RE2 syntax, full match.
enum MatchMode {
  MATCH_UNSPECIFIED = 0; // = MATCH_EXACT
  MATCH_EXACT = 1;
  MATCH_CONTAINS = 2;
  MATCH_STARTS_WITH = 3;
  MATCH_ENDS_WITH = 4;
  MATCH_REGEX = 5;
}

// The string-valued node properties a Match can constrain.
enum TextProperty {
  PROPERTY_UNSPECIFIED = 0; // rejected
  PROPERTY_TEXT = 1;
  PROPERTY_CONTENT_DESCRIPTION = 2;
  PROPERTY_HINT = 3;
  PROPERTY_CLASS_NAME = 4;
  PROPERTY_PACKAGE_NAME = 5;
}

// The boolean node properties a Flag can constrain.
enum NodeFlag {
  FLAG_UNSPECIFIED = 0; // rejected
  FLAG_ENABLED = 1;
  FLAG_CHECKED = 2;
  FLAG_CHECKABLE = 3;
  FLAG_CLICKABLE = 4;
  FLAG_FOCUSED = 5;
  FLAG_FOCUSABLE = 6;
  FLAG_LONG_CLICKABLE = 7;
  FLAG_SCROLLABLE = 8;
  FLAG_SELECTED = 9;
}

// Which relative a Related constrains.
enum Relation {
  RELATION_UNSPECIFIED = 0; // rejected
  RELATION_PARENT = 1;      // the direct parent matches
  RELATION_ANCESTOR = 2;    // some ancestor matches
  RELATION_CHILD = 3;       // at least one direct child matches
  RELATION_DESCENDANT = 4;  // at least one descendant matches
}

// A string property compared against `value` under `mode`.
message Match {
  TextProperty property = 1;
  string value = 2;
  MatchMode mode = 3;
}

// A boolean property that must equal `value`.
message Flag {
  NodeFlag property = 1;
  bool value = 2;
}

// A View resource id. With `package_name`: exactly `package_name:id/name`. Without: `name` in any
// package (`<any>:id/name`) or the bare `name`, which is how a Compose testTag appears under
// testTagsAsResourceId. `name` never contains `:id/`; put the package in `package_name`.
message ResourceId {
  string name = 1;
  optional string package_name = 2;
}

// The `relation` of the node must satisfy `node`.
message Related {
  Relation relation = 1;
  Node node = 2;
}

// Conjunction: every operand must hold. At least two operands.
message AllOf {
  repeated Node nodes = 1;
}

// Disjunction: at least one operand must hold. At least two operands. Evaluated by the
// driver's traversal plan rather than a native BySelector.
message AnyOf {
  repeated Node nodes = 1;
}

// One node predicate of the selector expression tree. Limits over the whole tree: depth ≤ 32,
// ≤ 256 nodes, strings ≤ 1024 chars.
message Node {
  oneof kind {
    Match match = 1;
    Flag flag = 2;
    ResourceId resource = 3;
    Related related = 4;
    AllOf all_of = 5;
    AnyOf any_of = 6;
  }
}

// Pick variants: exactly one match (default; more is AMBIGUOUS), the first in accessibility
// order, or the zero-based `index`-th in accessibility order (NOT_FOUND when absent).
message ExactlyOne {}
message First {}
message At {
  int32 index = 1;
}

// A complete selector: the node tree and how an action picks among matches. Package ownership
// is an ordinary PROPERTY_PACKAGE_NAME predicate; there is no separate execution scope.
// Built by the client DSLs and validated identically by the server and the driver.
message Selector {
  Node node = 1;
  oneof pick {
    ExactlyOne exactly_one = 4;
    First first = 5;
    At at = 6;
  }
}
