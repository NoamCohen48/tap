// tap.v1 — the per-connection event log: the device calls a client connection made, in order,
// as the daemon ran them (`ClientConnectionService.Events`). It is a record of what happened, for
// turning an exploratory session into a test; the daemon renders no code from it.
//
// Logged: every Execute except the diagnostic queries (`device_info`, `dump_hierarchy`), and the
// app calls that change the device (install, uninstall, force-stop, clear-data, grant, launch,
// cold launch, locales) and the device conditions (animations, dark mode, font scale,
// density). Not logged: screenshots, screen snapshots, ref resolution, driver logs and the
// app queries. A command's selector is logged as sent, so a ref an agent used appears as the
// selector the daemon resolved it to.

syntax = "proto3";

package tap.v1;

import "app.proto";
import "command.proto";
import "failure.proto";

option java_package = "io.github.noamcohen48.tap.api.v1";
option java_multiple_files = true;
option java_outer_classname = "EventLogProto";

message LoggedEvent {
  // 1, 2, 3, … per connection; never reused.
  int64 seq = 1;
  // When the call started.
  int64 at_epoch_ms = 2;
  int64 duration_ms = 3;
  string serial = 4;
  oneof call {
    Command command = 6;
    AppCall app = 7;
    DeviceCall device = 10;
  }
  // The command ran and the driver returned an error (`CommandResult.error`).
  optional Error error = 8;
  // The call failed as an RPC (the `tap-failure-bin` trailer), e.g. an app lifecycle failure.
  optional Failure failure = 9;
}

// An AppService call. `operation` is the RPC in snake_case: install, uninstall, force_stop,
// clear_data, grant_permission, revoke_permission, launch, cold_launch, foreground, open_link,
// set_locales.
message AppCall {
  string operation = 1;
  string package_name = 2;
  // launch / cold_launch.
  optional string activity = 3;
  // grant_permission / revoke_permission.
  optional string permission = 4;
  // The explicit timeout the call carried.
  optional int64 timeout_ms = 5;
  // open_link.
  optional string uri = 6;
  optional bool any_app = 7;
  // launch / cold_launch with extras.
  repeated IntentExtra extras = 8;
  // set_locales.
  repeated string locales = 9;
}

// A DeviceService condition call. `operation` is the RPC in snake_case: set_animations,
// set_dark_mode, set_font_scale, set_density, set_network, set_system_locales,
// set_location.
message DeviceCall {
  string operation = 1;
  // set_animations / set_dark_mode.
  optional bool enabled = 2;
  // set_font_scale.
  optional float font_scale = 3;
  // set_density; absent there = back to the physical density.
  optional int32 density_dpi = 4;
  // set_network: the switches the call set.
  optional bool airplane_mode = 5;
  optional bool wifi = 6;
  optional bool mobile_data = 7;
  // set_system_locales.
  repeated string locales = 8;
  // set_location.
  optional double latitude = 9;
  optional double longitude = 10;
}
