// tap.v1 — driver commands and their results.
//
// Part of the Tap host server API (see README.md for the file map) and, unchanged, of the
// device wire protocol: tap.wire.v1.Request carries a Command and tap.wire.v1.Response a
// CommandResult, so the daemon forwards both as they are. Host-internal operations (health,
// sync bootstrap/poll, the screenshot transfer) live only in tap.wire.v1; screenshots are
// `DeviceService.Screenshot`. Optional fields take their documented default on the driver, the
// one place defaults are applied.

syntax = "proto3";

package tap.v1;

import "selector.proto";

option java_package = "io.github.noamcohen48.tap.api.v1";
option java_multiple_files = true;
option java_outer_classname = "CommandProto";

// Closed error taxonomy shared with the device protocol; `Error.detail` refines it with a
// stable sub-reason. See the errors guide for meaning, mutation risk and retryability.
enum ErrorCode {
  ERR_UNSPECIFIED = 0;
  ERR_INVALID_REQUEST = 1;
  ERR_INVALID_SELECTOR = 2;
  ERR_UNSUPPORTED = 3;
  ERR_UNAUTHENTICATED = 4;
  ERR_SESSION_MISMATCH = 5;
  ERR_DUPLICATE_OR_STALE = 6;
  ERR_OVERLOADED = 7;
  ERR_AUT_MISMATCH = 8;
  ERR_NOT_FOUND = 9;
  ERR_AMBIGUOUS = 10;
  ERR_NOT_INTERACTABLE = 11;
  ERR_STALE_DURING_COMMAND = 12;
  ERR_ACTION_REJECTED = 13;
  ERR_WAIT_TIMEOUT = 14;
  ERR_CANCELLED = 15;
  ERR_DEADLINE_EXCEEDED = 16;
  ERR_AUT_NOT_INSTALLED = 17;
  ERR_AUT_CRASHED = 18;
  ERR_AUT_ANR = 19;
  ERR_SYNC_PROVIDER_UNAVAILABLE = 20;
  ERR_DRIVER_UNHEALTHY = 21;
  ERR_TRANSPORT_LOST = 22;
  ERR_INDETERMINATE = 23;
  ERR_ARTIFACT_TRANSFER_FAILED = 24;
  ERR_PAYLOAD_TOO_LARGE = 25;
  ERR_INTERNAL = 26;
  ERR_UNKNOWN = 27;
}

// Gesture direction: where the finger moves for `swipe`, the content edge scrolled towards for
// `scroll` (DOWN reveals content below).
enum Direction {
  DIR_UNSPECIFIED = 0;
  DIR_UP = 1;
  DIR_DOWN = 2;
  DIR_LEFT = 3;
  DIR_RIGHT = 4;
}

// What `wait_screen_stable` watches: the accessibility tree, the screen pixels, or both.
enum StabilitySignal {
  STABILITY_UNSPECIFIED = 0; // = STABILITY_ALL
  STABILITY_TREE = 1;
  STABILITY_PIXELS = 2;
  STABILITY_ALL = 3;
}

// A panel System UI draws over every app, opened with `open_system_panel`.
enum SystemPanel {
  SYSTEM_PANEL_UNSPECIFIED = 0;
  SYSTEM_PANEL_NOTIFICATIONS = 1; // the notification shade
  SYSTEM_PANEL_QUICK_SETTINGS = 2; // the quick settings panel
}

// ---- commands: one message per operation, each carrying only its own arguments -----------------

message DeviceInfoQuery {}
message PressKey { int32 key_code = 1; } // an Android KeyEvent key code, ≥ 0
// Opens `panel` (the accessibility global action); no target. Back or Home close it.
message OpenSystemPanel { SystemPanel panel = 1; } // not UNSPECIFIED
message DumpHierarchy {}

message Exists { Selector selector = 1; }
message Count { Selector selector = 1; }
message Snapshot { Selector selector = 1; }

message WaitVisible {
  Selector selector = 1;
  // true = wait for exactly one match (a mutation's precondition); false = one or more.
  bool exactly_one = 2;
}
message WaitGone { Selector selector = 1; }
message WaitAppVisible { string package_name = 1; }
message WaitScreenStable {
  string package_name = 1;
  optional int64 stable_for_ms = 2; // quiet period, 1..30000; default 500
  StabilitySignal signal = 3; // UNSPECIFIED = ALL
}

message Tap { Selector selector = 1; }
message LongTap { Selector selector = 1; }
message SetText { Selector selector = 1; string text = 2; } // ≤ 256 chars
// Key events for `text` (≤ 256 chars) into whatever has input focus; no target, no click.
// Clients tap the field first (the SDKs' element typeText does).
message TypeText {
  string text = 2;
}
message ClearText { Selector selector = 1; }

message Swipe {
  Selector selector = 1;
  Direction direction = 2;
  optional int32 distance_percent = 3; // 1..100; default 80
}
message Scroll {
  Selector selector = 1;
  Direction direction = 2;
  optional int32 distance_percent = 3; // 1..100; default 80
}

// One protocol request minus session identity (the server owns session id, generation and
// request ids). Exactly one `op` must be set; its case name is the protocol `op`.
message Command {
  optional int64 timeout_ms = 1; // absent = the attached device's default action timeout
  oneof op {
    DeviceInfoQuery device_info = 3;
    PressKey press_key = 4;
    DumpHierarchy dump_hierarchy = 6;
    Exists exists = 7;
    Count count = 8;
    Snapshot snapshot = 9;
    WaitVisible wait_visible = 10;
    WaitGone wait_gone = 11;
    WaitAppVisible wait_app_visible = 12;
    WaitScreenStable wait_screen_stable = 13;
    Tap tap = 14;
    LongTap long_tap = 15;
    SetText set_text = 16;
    TypeText type_text = 17;
    ClearText clear_text = 18;
    Swipe swipe = 19;
    Scroll scroll = 20;
    OpenSystemPanel open_system_panel = 24;
  }
}

// ---- results ------------------------------------------------------------------------------------

// Screen-pixel rectangle.
message Bounds {
  int32 left = 1;
  int32 top = 2;
  int32 right = 3;
  int32 bottom = 4;
}

// State of one matched node at the instant of `snapshot`.
message ElementSnapshot {
  optional string class_name = 1;
  optional string package_name = 2;
  optional string resource_name = 3;
  optional string text = 4;
  optional string content_description = 5;
  optional string hint = 6;
  Bounds bounds = 7;
  bool checkable = 8;
  bool checked = 9;
  bool clickable = 10;
  bool enabled = 11;
  bool focusable = 12;
  bool focused = 13;
  bool long_clickable = 14;
  bool scrollable = 15;
  bool selected = 16;
  int32 child_count = 17;
  // The node is showing its hint: on API 26+ an empty field then reports the hint as `text`.
  // `text` is always the raw accessibility text; selectors match that same raw text.
  bool showing_hint = 18;
}

// Static facts about the device plus the package currently owning the focused window.
message DeviceInfo {
  int32 api_level = 1;
  string manufacturer = 2;
  string model = 3;
  string product = 4;
  int32 display_width = 5;
  int32 display_height = 6;
  int32 display_rotation = 7;
  optional string current_package = 8;
}

// The command ran to completion and has nothing else to report.
message Done {}

// A failed command. Driver-side failures and driver-transport loss are data (including
// TRANSPORT_LOST / INDETERMINATE with `detail` = transmission state), never a gRPC error:
// gRPC status codes are reserved for the client↔server call itself.
message Error {
  ErrorCode code = 1;
  optional string detail = 2; // stable sub-reason; see the errors guide
  optional string message = 3; // human-readable context; never branch on it
  // WAIT_TIMEOUT of wait_visible / wait_gone: matches at the last poll (capped at 1000).
  optional int32 match_count = 4;
}

// One protocol response: exactly one `outcome`, named like the protocol result `kind`.
message CommandResult {
  int64 duration_ms = 1;
  // Identity of the protocol request the server issued, for diagnostics.
  int64 request_id = 2;
  int64 session_generation = 3;
  // swipe and scroll report `done`: whether content moved is for the test to observe.
  oneof outcome {
    Done done = 4;
    bool bool = 5; // exists
    int32 count = 7; // count, capped at 1000
    string text = 8; // dump_hierarchy
    ElementSnapshot snapshot = 9;
    DeviceInfo device_info = 10;
    Error error = 13;
  }
}
