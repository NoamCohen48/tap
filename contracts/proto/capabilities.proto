// tap.v1 — read-only operation support on one attached device, not wire negotiation.
syntax = "proto3";

package tap.v1;

option java_package = "io.github.noamcohen48.tap.api.v1";
option java_multiple_files = true;
option java_outer_classname = "CapabilitiesProto";

// Public device/app operations, with separate variants where prerequisites differ. SDK
// composites (back/home, wake/sleep, background, scroll-until, capture) use these primitives.
// App-private-data discovery stays on AppDataService.GetCapabilities; synchronization,
// connection/inventory, watcher and event-log services are outside this catalog.
enum CapabilityId {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_DEVICE_INFO = 1;
  CAPABILITY_PRESS_KEY = 2;
  CAPABILITY_DUMP_HIERARCHY = 3;
  CAPABILITY_EXISTS = 4;
  CAPABILITY_COUNT = 5;
  CAPABILITY_SNAPSHOT = 6;
  CAPABILITY_WAIT_VISIBLE = 7;
  CAPABILITY_WAIT_GONE = 8;
  CAPABILITY_WAIT_APP_VISIBLE = 9;
  CAPABILITY_WAIT_SCREEN_STABLE = 10;
  CAPABILITY_TAP = 11;
  CAPABILITY_LONG_TAP = 12;
  CAPABILITY_SET_TEXT = 13;
  CAPABILITY_TYPE_TEXT = 14;
  CAPABILITY_CLEAR_TEXT = 15;
  CAPABILITY_SWIPE = 16;
  CAPABILITY_SCROLL = 17;
  CAPABILITY_OPEN_SYSTEM_PANEL = 18;
  CAPABILITY_SET_ORIENTATION = 19;
  CAPABILITY_SET_DISPLAY_ROTATION = 20;
  CAPABILITY_UNFREEZE_ROTATION = 21;
  CAPABILITY_DISMISS_KEYGUARD = 22;
  CAPABILITY_DOUBLE_TAP = 23;
  CAPABILITY_DRAG = 24;
  CAPABILITY_PINCH = 25;
  CAPABILITY_FLING = 26;
  CAPABILITY_WAIT_PERMISSION_PROMPT = 27;
  CAPABILITY_CHOOSE_PERMISSION = 28;
  CAPABILITY_HIDE_KEYBOARD = 29;
  CAPABILITY_KEYBOARD_IME_ACTION = 30;
  CAPABILITY_CLIPBOARD_WRITE = 31;
  CAPABILITY_CLIPBOARD_READ = 32;
  CAPABILITY_AWAIT_TOAST = 33;
  CAPABILITY_ACCESSIBILITY_ACTION = 34;
  CAPABILITY_SET_PROGRESS = 35;
  CAPABILITY_SET_LOCATION = 36;
  CAPABILITY_AWAIT_NOTIFICATION = 37;
  CAPABILITY_LIST_NOTIFICATIONS = 38;
  CAPABILITY_OPEN_NOTIFICATION = 39;
  CAPABILITY_DISMISS_NOTIFICATION = 40;
  CAPABILITY_MULTI_TAP = 41;
  CAPABILITY_TIMED_PRESS = 42;
  CAPABILITY_WAIT_STATE = 43;
  CAPABILITY_ACCESSIBILITY_PAGE_UP = 44;
  CAPABILITY_ACCESSIBILITY_PAGE_DOWN = 45;
  CAPABILITY_ACCESSIBILITY_PAGE_LEFT = 46;
  CAPABILITY_ACCESSIBILITY_PAGE_RIGHT = 47;
  CAPABILITY_ACCESSIBILITY_PRESS_AND_HOLD = 48;
  CAPABILITY_SCREENSHOT = 49;
  CAPABILITY_DRIVER_LOG = 50;
  CAPABILITY_DEVICE_LOGS = 51;
  CAPABILITY_SCREEN_SNAPSHOT = 52;
  CAPABILITY_RESOLVE_REF = 53;
  CAPABILITY_DEVICE_SET_ANIMATIONS = 54;
  CAPABILITY_DEVICE_SET_DARK_MODE = 55;
  CAPABILITY_DEVICE_SET_FONT_SCALE = 56;
  CAPABILITY_DEVICE_SET_DENSITY = 57;
  CAPABILITY_DEVICE_SET_NETWORK = 58;
  CAPABILITY_NETWORK_DISABLE_WIFI = 59;
  CAPABILITY_NETWORK_ENABLE_AIRPLANE_MODE = 60;
  CAPABILITY_DEVICE_SET_SYSTEM_LOCALES = 61;
  CAPABILITY_DEVICE_SET_STAY_AWAKE = 62;
  CAPABILITY_DEVICE_SET_ACCESSIBILITY_DISPLAY = 63;
  CAPABILITY_DEVICE_SET_BOLD_TEXT = 64;
  CAPABILITY_GET_FOREGROUND_ACTIVITY = 65;
  CAPABILITY_PUSH_FILE = 66;
  CAPABILITY_PULL_FILE = 67;
  CAPABILITY_ADD_MEDIA = 68;
  CAPABILITY_RECORD_VIDEO = 69;
  CAPABILITY_RECORD_AUDIO_OUTPUT = 70;
  CAPABILITY_RECORD_AUDIO_PLAYBACK = 71;
  CAPABILITY_RECORD_AUDIO_MIC = 72;
  CAPABILITY_STOP_RECORDING = 73;
  CAPABILITY_APP_INSTALL = 74;
  CAPABILITY_APP_UNINSTALL = 75;
  CAPABILITY_APP_IS_INSTALLED = 76;
  CAPABILITY_APP_FORCE_STOP = 77;
  CAPABILITY_APP_CLEAR_DATA = 78;
  CAPABILITY_APP_GRANT_PERMISSION = 79;
  CAPABILITY_APP_REVOKE_PERMISSION = 80;
  CAPABILITY_APP_IS_PERMISSION_GRANTED = 81;
  CAPABILITY_APP_SET_LOCALES = 82;
  CAPABILITY_APP_GET_LOCALES = 83;
  CAPABILITY_APP_LAUNCH = 84;
  CAPABILITY_APP_COLD_LAUNCH = 85;
  CAPABILITY_APP_FOREGROUND = 86;
  CAPABILITY_APP_OPEN_LINK = 87;
  CAPABILITY_APP_PROCESS = 88;
  CAPABILITY_APP_IS_RUNNING = 89;
}

// Eligibility, not a promise of success: matching, occlusion, Android acceptance and transport
// checks remain authoritative. No automatic fallback, skip, preflight or mutation is implied.
enum CapabilityStatus {
  CAPABILITY_STATUS_UNSPECIFIED = 0;
  CAPABILITY_STATUS_SUPPORTED = 1;
  CAPABILITY_STATUS_CONDITIONAL = 2;
  CAPABILITY_STATUS_UNSUPPORTED = 3;
  CAPABILITY_STATUS_UNKNOWN = 4;
}

enum CapabilityReason {
  CAPABILITY_REASON_UNSPECIFIED = 0;
  CAPABILITY_REASON_REQUIRES_API = 1;
  CAPABILITY_REASON_MISSING_HOST_TOOL = 2;
  CAPABILITY_REASON_NETWORK_ADB = 3;
  CAPABILITY_REASON_NOT_NEGOTIATED = 4;
  CAPABILITY_REASON_FACT_UNAVAILABLE = 5;
  CAPABILITY_REASON_PREREQUISITE = 6;
}

// Specific remaining requirements; discovery never exercises the operation to satisfy them.
enum CapabilityRequirement {
  CAPABILITY_REQUIREMENT_UNSPECIFIED = 0;
  CAPABILITY_REQUIREMENT_TARGET_OFFERS_ACTION = 1;
  CAPABILITY_REQUIREMENT_NONSECURE_KEYGUARD = 2;
  CAPABILITY_REQUIREMENT_PERMISSION_CHOICE_OFFERED = 3;
  CAPABILITY_REQUIREMENT_RECORDING_RUNTIME = 4; // compatible scrcpy, encoders, capture access
  CAPABILITY_REQUIREMENT_CAPTURE_NOT_EXCLUDED = 5; // playback apps may exclude their audio
  CAPABILITY_REQUIREMENT_SAFE_NETWORK_VALUES = 6;
  CAPABILITY_REQUIREMENT_RECORDING_ACTIVE = 7;
}

message DeviceCapability {
  CapabilityId id = 1;
  CapabilityStatus status = 2;
  repeated CapabilityReason reasons = 3;
  optional int32 required_api = 4;
  repeated CapabilityRequirement requirements = 5;
  string detail = 6; // explanatory only; clients branch on typed fields
}

message GetDeviceCapabilitiesRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
}

message GetDeviceCapabilitiesResponse {
  // Sorted by ID, one entry per known ID (including unsupported); unknown future IDs are legal.
  repeated DeviceCapability capabilities = 1;
}
