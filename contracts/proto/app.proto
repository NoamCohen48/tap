// tap.v1 — app lifecycle on an attached device: each call is executed over ADB and verified
// against a postcondition (the host's AppLifecycle is the one source of truth for the rules).
// Failures are gRPC FAILED_PRECONDITION with a message. An absent `timeout_ms` means the
// daemon's default for that operation.

syntax = "proto3";

package tap.v1;

option java_package = "io.github.noamcohen48.tap.api.v1";
option java_multiple_files = true;
option java_outer_classname = "AppProto";

service AppService {
  // `adb install -r -t` of the uploaded APK, verified. The client streams an InstallHeader
  // first, then the APK bytes in chunks.
  rpc Install(stream InstallRequest) returns (InstallResponse);
  rpc Uninstall(UninstallRequest) returns (UninstallResponse); // `pm uninstall`, verified.
  rpc IsInstalled(IsInstalledRequest) returns (IsInstalledResponse);
  rpc ForceStop(ForceStopRequest) returns (ForceStopResponse); // `am force-stop` plus proof that no process and no activity of the package remain.
  rpc ClearData(ClearDataRequest) returns (ClearDataResponse); // `pm clear`; data, cache and runtime permissions gone, app left stopped (no process, no activity).
  rpc GrantPermission(GrantPermissionRequest) returns (GrantPermissionResponse); // `pm grant` a runtime permission.
  // `pm revoke` a runtime permission, verified like a grant. Android kills the app's process.
  rpc RevokePermission(RevokePermissionRequest) returns (RevokePermissionResponse);
  // Whether `dumpsys package` lists the permission as granted to the package (a read; not logged).
  rpc IsPermissionGranted(IsPermissionGrantedRequest) returns (IsPermissionGrantedResponse);
  // The app's own languages (`cmd locale set-app-locales`, API 33+; FAILED_PRECONDITION,
  // UNSUPPORTED_API below), BCP-47 tags in preference order; empty = follow the system. Read
  // back after the change; restored on detach like the device conditions.
  rpc SetLocales(SetLocalesRequest) returns (SetLocalesResponse);
  // The app's own languages now (`cmd locale get-app-locales`); empty = it follows the system.
  rpc GetLocales(GetLocalesRequest) returns (GetLocalesResponse);
  rpc Launch(LaunchRequest) returns (LaunchResponse); // Start the activity (or the launcher) and wait for the package to own the focused window.
  rpc ColdLaunch(ColdLaunchRequest) returns (ColdLaunchResponse); // Verified force-stop, launch, then a new process identity in the foreground.
  // `am start -W` of the launcher intent, as the home screen does: the app's existing task comes
  // back as it was left; with no task, the launcher activity starts.
  rpc Foreground(ForegroundRequest) returns (ForegroundResponse);
  // `am start -W -a android.intent.action.VIEW -d <uri>`, limited to the package unless `any_app`.
  rpc OpenLink(OpenLinkRequest) returns (OpenLinkResponse);
  rpc Process(ProcessRequest) returns (ProcessResponse); // The single current process identity.
  rpc IsRunning(IsRunningRequest) returns (IsRunningResponse); // Whether any process of the package is alive.
  rpc AwaitIdle(AwaitIdleRequest) returns (AwaitIdleResponse); // Wait until the app's sync-sdk busy count is zero and stable for `stable_for_ms`.
}

// The package an App call acts on, on a device the calling connection has attached.
message AppTarget {
  string client_connection_id = 1;
  string attached_device_id = 2;
  string package_name = 3;
}

// PID plus a start token that changes on every process start.
message ProcessIdentity {
  int32 pid = 1;
  string start_token = 2;
}

message InstallHeader {
  AppTarget app = 1; // package_name: the package the APK must install as
  optional int64 timeout_ms = 2;
  int64 size_bytes = 3; // exact APK size; the upload is rejected on mismatch
}

message InstallRequest {
  oneof part {
    InstallHeader header = 1; // first message only
    bytes chunk = 2; // every later message
  }
}

message InstallResponse {}

message UninstallRequest {
  AppTarget app = 1;
}

message UninstallResponse {}

message IsInstalledRequest {
  AppTarget app = 1;
}

message IsInstalledResponse {
  bool installed = 1;
}

message ForceStopRequest {
  AppTarget app = 1;
  optional int64 timeout_ms = 2;
}

message ForceStopResponse {}

message ClearDataRequest {
  AppTarget app = 1;
  optional int64 timeout_ms = 2;
}

message ClearDataResponse {}

message GrantPermissionRequest {
  AppTarget app = 1;
  string permission = 2;
}

message GrantPermissionResponse {}

message RevokePermissionRequest {
  AppTarget app = 1;
  string permission = 2;
}

message RevokePermissionResponse {}

message IsPermissionGrantedRequest {
  AppTarget app = 1;
  string permission = 2;
}

message IsPermissionGrantedResponse {
  bool granted = 1;
}

message SetLocalesRequest {
  AppTarget app = 1;
  // At most 16 well-formed, distinct BCP-47 tags (`fr-FR`, `pt-BR`, `zh-Hant-TW`).
  repeated string locales = 2;
}

message SetLocalesResponse {}

message GetLocalesRequest {
  AppTarget app = 1;
}

message GetLocalesResponse {
  repeated string locales = 1;
}

// One `am start` extra. `key`: 1..256 chars, no whitespace or control characters.
message IntentExtra {
  string key = 1;
  oneof value {
    string string_value = 2; // --es (≤ 4096 chars)
    bool bool_value = 3; // --ez
    int32 int_value = 4; // --ei
    int64 long_value = 5; // --el
    float float_value = 6; // --ef (finite)
  }
}

message LaunchRequest {
  AppTarget app = 1;
  optional string activity = 2; // absent = launcher activity
  optional int64 timeout_ms = 3;
  repeated IntentExtra extras = 4; // ≤ 64, distinct keys
}

message LaunchResponse {}

message ColdLaunchRequest {
  AppTarget app = 1;
  optional string activity = 2; // absent = launcher activity
  optional int64 timeout_ms = 3;
  repeated IntentExtra extras = 4; // as LaunchRequest
}

message ColdLaunchResponse {
  ProcessIdentity process = 1;
}

message ForegroundRequest {
  AppTarget app = 1;
  optional int64 timeout_ms = 2;
}

message ForegroundResponse {}

message OpenLinkRequest {
  AppTarget app = 1;
  string uri = 2; // an absolute URI (scheme required); ≤ 2048 chars, no whitespace or control characters
  // false: only the package may handle it (`-p`), so no chooser can appear. true: Android
  // resolves it as a tapped link would — another app, the browser, or a chooser.
  bool any_app = 3;
  optional int64 timeout_ms = 4;
}

message OpenLinkResponse {
  // The activity Android reports it started or delivered the link to (`package/class`); absent
  // when `am start` names none.
  optional string activity = 1;
}

message ProcessRequest {
  AppTarget app = 1;
  optional int64 timeout_ms = 2;
}

message ProcessResponse {
  ProcessIdentity process = 1;
}

message IsRunningRequest {
  AppTarget app = 1;
}

message IsRunningResponse {
  bool running = 1;
}

message AwaitIdleRequest {
  AppTarget app = 1;
  optional int64 timeout_ms = 2;
  optional int64 stable_for_ms = 3; // absent = 200
}

message AwaitIdleResponse {}
