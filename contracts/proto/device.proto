// tap.v1 — device inventory and attachments. There is no separate lease RPC: an attached
// device is in use while its DeviceSession holds the per-serial lock
// (`~/.tap/sessions/<serial>.lock`). Attach may wait up to `lease_timeout_ms`; Detach or a
// disconnected owning client releases the device after cleanup. Every call on an attached
// device names the owning `client_connection_id`; another connection gets PERMISSION_DENIED.

syntax = "proto3";

package tap.v1;

import "command.proto";
import "selector.proto";

option java_package = "io.github.noamcohen48.tap.api.v1";
option java_multiple_files = true;
option java_outer_classname = "DeviceProto";

service DeviceService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc Attach(AttachRequest) returns (AttachResponse);
  rpc Detach(DetachRequest) returns (DetachResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc Screenshot(ScreenshotRequest) returns (ScreenshotResponse);
  rpc DriverLog(DriverLogRequest) returns (DriverLogResponse);
  // One optional host-managed scrcpy capture per attachment (video, audio or both); the driver
  // never encodes media. Requires scrcpy on the daemon host.
  rpc StartRecording(StartRecordingRequest) returns (StartRecordingResponse);
  rpc StopRecording(StopRecordingRequest) returns (StopRecordingResponse);
  // A compact, ref-addressed outline of the screen, parsed from the diagnostic hierarchy dump
  // (`.docs/agent-surface.md`). Refs name selectors the daemon synthesised, never node handles.
  rpc ScreenSnapshot(ScreenSnapshotRequest) returns (ScreenSnapshotResponse);
  // The selector a ref of the latest snapshot names. Unknown ref: NOT_FOUND (UNKNOWN_REF);
  // a node with no selector: FAILED_PRECONDITION (REF_NOT_ADDRESSABLE).
  rpc ResolveRef(ResolveRefRequest) returns (ResolveRefResponse);
  // Device-wide conditions. Each changed value is captured before the session's first change
  // of it, journaled, and restored when the device is detached (or by the next attach when the
  // daemon died first); a restore that cannot be proven quarantines the device. Every change is
  // read back: a value the device did not take is FAILED_PRECONDITION (DEVICE_SETTING).
  // The three animation scales (window, transition, animator duration): all 0 or all 1.
  rpc SetAnimations(SetAnimationsRequest) returns (SetAnimationsResponse);
  // `cmd uimode night yes|no`. API 29+ (FAILED_PRECONDITION, UNSUPPORTED_API below).
  rpc SetDarkMode(SetDarkModeRequest) returns (SetDarkModeResponse);
  // The system font scale (`font_scale`), 0.5 to 2.0.
  rpc SetFontScale(SetFontScaleRequest) returns (SetFontScaleResponse);
  // `wm density`: an override in dpi (100 to 1000), or absent for the display's physical density.
  rpc SetDensity(SetDensityRequest) returns (SetDensityResponse);
}

// State of a listed device.
enum DeviceState {
  DEVICE_STATE_UNSPECIFIED = 0;
  DEVICE_FREE = 1;
  DEVICE_LEASED = 2;
  DEVICE_QUARANTINED = 3;
  DEVICE_OFFLINE = 4;
  DEVICE_UNAUTHORIZED = 5;
}

// One listed device. Anything richer than the serial comes from DeviceInfo after attachment.
message DeviceEntry {
  string serial = 1;
  DeviceState state = 2;
  // The holding connection when this daemon holds it (LEASED); absent for another process.
  optional string client_connection_id = 3;
  optional string quarantine_reason = 4;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated DeviceEntry devices = 1;
}

message AttachRequest {
  string client_connection_id = 1;
  string serial = 2;
  // Skip installing the daemon's driver (bundled or `tap serve --driver-apk`): the device
  // already has the right one.
  optional bool skip_driver_install = 4;
  optional int64 default_timeout_ms = 7;
  // How long to wait for another session's lock on the serial; absent = fail at once.
  optional int64 lease_timeout_ms = 8;
}

message AttachResponse {
  string attached_device_id = 1;
  string serial = 2;
  int64 generation = 3;
  DeviceInfo device_info = 4;
}

message DetachRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
}

message DetachResponse {
  // False when cleanup timed out or the session was quarantined; `detail` says why.
  bool clean = 1;
  optional string detail = 2;
}

message ExecuteRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
  Command command = 3;
}

message ExecuteResponse {
  CommandResult result = 1;
}

message ScreenshotRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
  optional int64 timeout_ms = 3;
}

message ScreenshotResponse {
  bytes png = 1;
  string sha256 = 2;
  optional int32 width = 3;
  optional int32 height = 4;
}

// A bounded artifact: video is H.264 MP4, audio is Opus, combined is Matroska (H.264+Opus).
// Clients select tracks at Start; Stop returns their one muxed file (never two scrcpy children).
message StartRecordingRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
  bool video = 3;
  // Empty means no audio. "output" (Android 11+; mutes the device speakers), "playback"
  // (Android 13+; keeps local playback, apps can opt out) or "mic" (the device microphone).
  string audio_source = 4;
  // Absent/zero = 30 s with video, 60 s audio only. Max 30 s video / 60 s audio.
  int32 max_seconds = 5;
}

message StartRecordingResponse {}

message StopRecordingRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
}

message StopRecordingResponse {
  bytes data = 1; // ≤16 MiB video, ≤3 MiB audio-only
  string format = 2; // mp4, mkv, opus
  string sha256 = 3;
}

message DriverLogRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
}

message DriverLogResponse {
  repeated string lines = 1;
}

message ScreenSnapshotRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
  // For the hierarchy dump; absent = the attached device's default command timeout.
  optional int64 timeout_ms = 3;
  // Also fill ScreenNode.candidates (an inspector offering the user a choice of selectors).
  bool selector_candidates = 4;
}

// How a synthesised selector singles out its node.
enum SelectorKind {
  SELECTOR_KIND_UNSPECIFIED = 0;
  // One predicate: resource id, text, description or hint.
  SELECTOR_KIND_PLAIN = 1;
  // Two predicates of the node itself (resource and text, text and class, ...).
  SELECTOR_KIND_COMBINED = 2;
  // The node's own predicate plus an `ancestor` relation to an addressable ancestor.
  SELECTOR_KIND_ANCESTOR = 3;
  // All of the node's predicates plus an `At` pick: correct for this dump, fragile if the
  // screen reorders.
  SELECTOR_KIND_BY_INDEX = 4;
}

// A selector that matched only its node in the dump.
message SelectorCandidate {
  Selector selector = 1;
  SelectorKind kind = 2;
}

// A node against the previous snapshot of the same attached device.
enum NodeChange {
  NODE_CHANGE_UNSPECIFIED = 0; // there was no previous snapshot
  NODE_ADDED = 1;
  NODE_UNCHANGED = 2;
  NODE_REMOVED = 3;
}

// One visible node, in dump (pre-order) order.
message ScreenNode {
  // `e<N>`. Stable across snapshots while the node is unchanged; never reused for another node.
  string ref = 1;
  int32 depth = 2;
  // The package of the window root the node is under.
  string window_package = 3;
  optional string class_name = 4;
  optional string resource_name = 5;
  optional string text = 6;
  optional string content_description = 7;
  optional string hint = 8;
  Bounds bounds = 9;
  // The boolean properties that are true.
  repeated NodeFlag flags = 10;
  bool password = 11;
  // Clickable, long-clickable, checkable, scrollable or editable.
  bool interactive = 12;
  // A selector that matched only this node in the dump; absent when none was found.
  optional Selector selector = 13;
  // The selector ends in an `At` pick: correct for this dump, fragile if the screen reorders.
  bool by_index = 14;
  NodeChange change = 15;
  // Only with ScreenSnapshotRequest.selector_candidates: every selector that matched only this
  // node, best first (the first is `selector`). A candidate that merely adds predicates to an
  // earlier one is left out, and a BY_INDEX pick is offered only when nothing else is unique.
  repeated SelectorCandidate candidates = 16;
}

message ScreenSnapshotResponse {
  // Increases per attached device.
  int64 snapshot_id = 1;
  repeated ScreenNode nodes = 2;
  // Nodes of the previous snapshot that are gone; their refs no longer resolve.
  repeated ScreenNode removed = 3;
  int32 rotation = 4;
}

message ResolveRefRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
  // With or without the leading `@`.
  string ref = 3;
}

message ResolveRefResponse {
  Selector selector = 1;
  bool by_index = 2;
  int64 snapshot_id = 3;
}

message SetAnimationsRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
  bool enabled = 3;
}

message SetAnimationsResponse {}

message SetDarkModeRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
  bool enabled = 3;
}

message SetDarkModeResponse {}

message SetFontScaleRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
  float scale = 3;
}

message SetFontScaleResponse {}

message SetDensityRequest {
  string client_connection_id = 1;
  string attached_device_id = 2;
  // Absent: remove the override (the display's physical density).
  optional int32 dpi = 3;
}

message SetDensityResponse {}
