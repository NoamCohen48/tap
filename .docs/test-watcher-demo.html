<main class="layout">
<aside aria-label="Devices"><section><div class="section-label">Devices · 2</div><div class="devices" id="devices"></div></section></aside>
<section class="viewer" aria-label="Device screen"><div class="viewer-head"><div><h2 id="device-title"></h2><p id="device-subtitle"></p><select id="device-picker" class="device-picker" aria-label="Choose device"><option value="0">Pixel 7 · JUnit</option><option value="1">Samsung J8 · tap-agent</option></select></div><span class="stream-status"><span class="dot"></span>Video stream</span></div><div class="stage" id="stage"></div><div class="screen-footer"><span id="frame-source"></span></div><div class="scrubber"><div class="scrubber-top"><label class="frame-switch" title="Show approximate before/after samples from video"><input id="action-frames" type="checkbox">Action frames</label><div class="frame-controls" id="frame-controls" hidden><div class="segmented" aria-label="Frame view"><button data-view="before">Before</button><button data-view="after">After</button><button data-view="compare">Compare</button></div></div></div><div class="video-controls"><button id="play" class="icon-button" aria-label="Play" title="Play"><span class="playback-icon" aria-hidden="true"></span></button><input id="video-slider" type="range" min="0" max="12000" step="10" value="0" aria-label="Video position in milliseconds"><span id="video-time" class="timecode"></span><button id="live" class="live-button" title="Go to the latest frame" aria-label="Go to live edge"><span class="live-edge-icon" aria-hidden="true"></span>Live</button></div><div class="scrub-actions" id="scrub"></div><div class="recording-tools"><div class="clip-info"><span class="clip-dot" aria-hidden="true"></span><div><strong>Recording</strong><span id="record-status">Sample recording</span></div></div><div class="clip-actions"><button id="record">New recording</button><button id="trim" aria-expanded="false">Trim</button><button class="export" id="download" title="Demo placeholder: export video and timestamped steps.json; no download occurs">Export clip</button></div></div><div class="trim-row" id="trim-row" hidden><label>In <input id="trim-in" type="number" min="0" step="0.1" value="0" aria-label="Clip start in seconds">s</label><label>Out <input id="trim-out" type="number" min="0" step="0.1" value="0" aria-label="Clip end in seconds">s</label><button id="set-in">Set in here</button><button id="set-out">Set out here</button><span class="clip-caption" id="clip-caption"></span></div></div></section>
<section class="timeline" aria-label="Action timeline"><div class="timeline-head"><div><h2>Action timeline</h2><span class="badge neutral" id="event-count"></span></div><label class="search-label" for="search">Find an action or selector</label><input class="search" id="search" type="search" placeholder="Search this device…"><div class="filter-row" aria-label="Timeline filter"><button data-filter="all" class="active">All actions</button><button data-filter="failed">Failures</button></div></div><div class="tests" id="tests"></div><section class="details" aria-label="Selected action details" id="details"></section></section>
</main>
<script>
'use strict';
const devices=[
 {name:'Pixel 7',serial:'emulator-5554',api:'Android 14 · API 34',run:'junit 18432 · tap',actions:[
   {name:'Launch app',selector:'app("dev.tap.fixture")',duration:184,before:'home',after:'product'},
   {name:'Tap',selector:'id("add_to_cart")',duration:251,before:'product',after:'cart'},
   {name:'Assert visible',selector:'text("Your cart")',duration:63,before:'cart',after:'cart'},
   {name:'Tap',selector:'id("checkout")',duration:218,before:'cart',after:'checkout'},
   {name:'Set text',selector:'id("email") · "alex@example.com"',duration:102,before:'checkout',after:'filled'},
   {name:'Tap',selector:'text("Place order")',duration:246,before:'filled',after:'success'},
   {name:'Tap',selector:'text("Place order")',duration:253,before:'filled',after:'error'},
   {name:'Await visible',selector:'text("Order confirmed")',duration:5002,before:'error',after:'error',failed:true,error:'NOT_FOUND',message:'No element matched text("Order confirmed") within 5,000 ms.'}]},
 {name:'Samsung J8',serial:'85e49002',api:'Android 9 · API 29',run:'tap-agent 19206',actions:[
   {name:'Launch app',selector:'app("dev.tap.fixture")',duration:301,before:'home',after:'product'},
   {name:'Tap',selector:'id("add_to_cart")',duration:357,before:'product',after:'cart'},
   {name:'Tap',selector:'id("checkout")',duration:329,before:'cart',after:'checkout'},
   {name:'Set text',selector:'id("email") · "alex@example.com"',duration:165,before:'checkout',after:'filled'},
   {name:'Assert enabled',selector:'text("Place order")',duration:79,before:'filled',after:'filled'}]}
];
// Every image and timestamp is a mock. No video capture, encoding or download occurs.
for(const device of devices){let cursor=700;device.actions=device.actions.map((a,index)=>{const start=cursor;cursor+=a.duration+600;return {...a,seq:index+1,start,end:start+a.duration};});device.total=cursor+100;}
let deviceIndex=0,selected=4,view='after',overlay=false,actionFrames=false,filter='all',following=false,timer=null;
let playhead=0,playing=false,recording=false,trimIn=0,trimOut=devices[0].total;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Defense in depth: only inert demo markup and a narrow set of attributes/styles
// may reach the page, even if sample data is later replaced with external data.
function setMarkup(element,markup){
 const doc=new DOMParser().parseFromString(markup,'text/html');
 const tags=new Set(['BUTTON','SPAN','STRONG','SMALL','DIV','P','BR','H2','DL','DT','DD']);
 const attrs=new Set(['class','title','aria-label','aria-pressed','data-device','data-action']);
 const styles=new Set(['font-size','margin-top','border-top','padding-top','float','color','padding','left']);
 for(const node of [...doc.body.querySelectorAll('*')]){
  if(!tags.has(node.tagName)){node.remove();continue;}
  for(const attr of [...node.attributes]){
   if(attr.name==='style'){
    for(const property of [...node.style])if(!styles.has(property)||/url\s*\(|expression/i.test(node.style.getPropertyValue(property)))node.style.removeProperty(property);
   }else if(!attrs.has(attr.name))node.removeAttribute(attr.name);
  }
 }
 element.replaceChildren(...doc.body.childNodes);
}
function actions(){return devices[deviceIndex].actions;}
function stopFollow(){following=false;clearInterval(timer);timer=null;}
function stamp(ms){const s=Math.max(0,ms)/1000;return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toFixed(2).padStart(5,'0');}
function stateAt(ms){let state=actions()[0].before;for(const a of actions()){if(ms<a.start)return state;if(ms<a.end+120)return a.before;state=a.after;}return state;}
function selectAction(index){stopFollow();playing=false;selected=index;playhead=actions()[index].start;render();}
function resetDevice(){stopFollow();playing=false;recording=false;playhead=0;selected=0;trimIn=0;trimOut=devices[deviceIndex].total;filter='all';$('search').value='';render();}
function sizePreview(){const stage=$('stage');const width=actionFrames&&view==='compare'?584:300;stage.style.setProperty('--preview-scale',Math.max(.1,Math.min(1,(stage.clientWidth-28)/width,(stage.clientHeight-28)/580)));}
function frame(state,action,phase){
 const highlighted=overlay&&phase==='before';
 const cls=target=>highlighted&&action.target===target?' target':'';
 let content='';
 if(state==='home')content='<div class="app-title">Good things,<br>every day.</div><div class="app-copy">Your essentials, all in one place.</div><div class="product"><div class="bottle"></div></div><div class="app-button">Browse essentials</div>';
 if(state==='product')content='<div class="app-eyebrow">Everyday essentials</div><div class="app-title">Carry less.<br>Go further.</div><div class="product"><div class="bottle"></div></div><div class="product-info"><span>Field bottle · Moss</span><strong>$24.00</strong></div><div class="app-button'+cls('add')+'">Add to cart</div>';
 if(state==='cart')content='<div class="app-title">Your cart</div><div class="product"><div class="bottle"></div></div><div class="product-info"><span>Field bottle × 1</span><strong>$24.00</strong></div><div class="product-info" style="border-top:1px solid #e1e4e7;padding-top:17px"><span>Total</span><strong>$24.00</strong></div><div class="app-button'+cls('checkout')+'">Checkout</div>';
 if(['checkout','filled','error'].includes(state))content='<div class="app-title">Checkout</div><div class="app-copy">Where should we send your receipt?</div><div style="font-size:10px;margin-top:25px">Email address</div><div class="app-field'+cls('email')+'">'+(state==='checkout'?'<span style="color:#737b87">you@example.com</span>':'alex@example.com')+'</div><div class="product-info" style="margin-top:24px"><span>Order total</span><strong>$24.00</strong></div>'+(state==='error'?'<div class="app-error">Payment could not be processed.<br>Please try again.</div>':'')+'<div class="app-button'+cls('order')+'">Place order</div>';
 if(state==='success')content='<div style="padding-top:50px"><div class="app-success">✓</div><div class="app-title">Order confirmed</div><div class="app-copy">Your Field bottle is on its way.<br>We sent a receipt to alex@example.com.</div><div style="margin-top:26px;border-top:1px solid #e1e4e7;padding-top:16px;font-size:11px">Order #1048 <span style="float:right">$24.00</span></div></div>';
 let sample=playhead;
 if(phase==='before')sample=Math.max(0,action.start-33);
 if(phase==='after')sample=Math.min(devices[deviceIndex].total,action.end+150);
 const time=stamp(sample);
 return '<div class="frame-wrap"><div class="frame-label"><strong>'+ (phase==='before'?'Before · approximate':phase==='live'?'Video playback':'After · approximate')+'</strong><span class="mono">'+time+'</span></div><div class="phone"><div class="phone-screen"><div class="statusbar"><span>12:41</span><span>LTE · 92%</span></div><div class="app-header">field<span style="float:right;font-size:10px;padding-top:7px">SHOP</span></div><div class="app-body">'+content+'</div><div class="navline"></div></div></div></div>';
}
function render(){
 const d=devices[deviceIndex],all=actions(),a=all[selected];
 setMarkup($('devices'),devices.map((dev,i)=>'<button class="device '+(i===deviceIndex?'selected':'')+'" data-device="'+i+'" aria-pressed="'+(i===deviceIndex)+'"><span class="device-name"><strong>'+dev.name+'</strong><span class="badge neutral">'+(i===0?'JUnit':'Agent')+'</span></span><span class="meta mono">'+dev.serial+'</span><span class="meta">'+dev.api+'</span><span class="device-owner"><span class="dot"></span><span class="mono">'+esc(dev.run)+'</span></span></button>').join(''));
 $('device-title').textContent=d.name;$('device-subtitle').textContent=d.serial+' · '+d.run;
 const atLiveEdge=playhead>=d.total&&!actionFrames;
 $('live').classList.toggle('active',atLiveEdge);$('live').setAttribute('aria-pressed',String(atLiveEdge));
 document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view));});
 $('device-picker').value=String(deviceIndex);
 $('frame-controls').hidden=!actionFrames;
 $('stage').classList.toggle('compare',actionFrames&&view==='compare');
 let screenMarkup=frame(a.before,a,'before')+frame(a.after,a,'after');
 if(view!=='compare')screenMarkup=frame(a[view],a,view);
 if(!actionFrames)screenMarkup=frame(stateAt(playhead),a,'live');
 setMarkup($('stage'),'<div class="previews">'+screenMarkup+'</div>');sizePreview();
 $('frame-source').textContent=actionFrames?'Video samples · approximate':'Playback · '+stamp(playhead);
 $('video-slider').max=String(d.total);$('video-slider').value=String(playhead);
 $('video-time').textContent=stamp(playhead)+' / '+stamp(d.total);
 $('play').classList.toggle('is-playing',playing);
 $('play').setAttribute('aria-label',playing?'Pause':'Play');$('play').title=playing?'Pause':'Play';
 $('trim-in').max=String(d.total/1000);$('trim-out').max=String(d.total/1000);
 $('trim-in').value=(trimIn/1000).toFixed(2);$('trim-out').value=(trimOut/1000).toFixed(2);
 $('clip-caption').textContent='Export range: '+stamp(Math.max(0,trimOut-trimIn));
 $('record').textContent=recording?'Stop recording':'New recording';$('record').classList.toggle('record-active',recording);
 $('record-status').textContent=recording?'Capturing · '+stamp(playhead):'Sample · '+stamp(Math.max(0,trimOut-trimIn));
 document.querySelector('.clip-info').classList.toggle('capturing',recording);
 setMarkup($('scrub'),all.map((ev,i)=>'<button data-action="'+i+'" style="left:'+((ev.start/d.total)*100).toFixed(3)+'%" class="'+(selected===i?'selected ':'')+(ev.failed?'error':'')+'" aria-label="Action '+(i+1)+' at '+stamp(ev.start)+': '+esc(ev.name)+'" aria-pressed="'+(selected===i)+'" title="'+esc(ev.name+' · '+stamp(ev.start))+'"><span>'+stamp(ev.start)+'</span></button>').join(''));
 renderTimeline();
 setMarkup($('details'),'<div class="details-heading"><h2>'+esc(a.name)+'</h2><span class="badge '+(a.failed?'failed':'')+'">'+(a.failed?'Failed':'Succeeded')+'</span></div><dl><dt>Selector</dt><dd class="mono">'+esc(a.selector)+'</dd><dt>Video time</dt><dd class="mono">'+stamp(a.start)+' → '+stamp(a.end)+'</dd><dt>Duration</dt><dd class="mono">'+a.duration.toLocaleString()+' ms</dd><dt>Connection</dt><dd>'+esc(d.run)+'</dd><dt>Device</dt><dd class="mono">'+d.serial+'</dd></dl>'+(a.failed?'<div class="error-details"><strong>'+a.error+'</strong><p style="margin-top:4px">'+esc(a.message)+'</p></div>':''));
}
function renderTimeline(){
 const query=$('search').value.toLowerCase();
 const matching=actions().map((a,index)=>({...a,index})).filter(a=>(filter!=='failed'||a.failed)&&(a.name+' '+a.selector).toLowerCase().includes(query));
 setMarkup($('tests'),matching.map(a=>'<button class="event '+(a.index===selected?'selected ':'')+(a.failed?'failed':'')+'" data-action="'+a.index+'" aria-pressed="'+(a.index===selected)+'"><span class="event-icon">'+(a.failed?'!':'✓')+'</span><span><span class="event-title">'+esc(a.name)+'</span><span class="event-selector">'+esc(a.selector)+'</span><span class="event-time">'+stamp(a.start)+'</span></span><span class="event-duration">'+a.duration.toLocaleString()+' ms</span></button>').join('')||'<p class="empty">No matching actions on this device. Try another search or show all actions.</p>');
 $('event-count').textContent=matching.length+' actions';
 document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter));});
}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
 if(b.dataset.device!==undefined){deviceIndex=Number(b.dataset.device);resetDevice();}
 if(b.dataset.action!==undefined)selectAction(Number(b.dataset.action));
 if(b.dataset.view&&actionFrames){view=b.dataset.view;render();}
 if(b.dataset.panel){document.body.classList.toggle('show-actions',b.dataset.panel==='actions');document.querySelectorAll('[data-panel]').forEach(tab=>tab.classList.toggle('active',tab===b));sizePreview();}
 if(b.dataset.filter){filter=b.dataset.filter;renderTimeline();}
});
$('search').addEventListener('input',renderTimeline);
$('action-frames').addEventListener('change',()=>{actionFrames=$('action-frames').checked;render();});
$('device-picker').addEventListener('change',()=>{deviceIndex=Number($('device-picker').value);resetDevice();});
new ResizeObserver(sizePreview).observe($('stage'));
$('live').addEventListener('click',()=>{stopFollow();playing=false;actionFrames=false;$('action-frames').checked=false;playhead=devices[deviceIndex].total;selected=actions().length-1;render();});
$('video-slider').addEventListener('input',()=>{playing=false;actionFrames=false;$('action-frames').checked=false;playhead=Number($('video-slider').value);render();});
$('play').addEventListener('click',()=>{actionFrames=false;$('action-frames').checked=false;if(playhead>=devices[deviceIndex].total)playhead=0;playing=!playing;render();});
$('trim').addEventListener('click',()=>{$('trim-row').hidden=!$('trim-row').hidden;$('trim').setAttribute('aria-expanded',String(!$('trim-row').hidden));sizePreview();});
$('set-in').addEventListener('click',()=>{trimIn=playhead;trimOut=Math.max(trimOut,trimIn);render();});
$('set-out').addEventListener('click',()=>{trimOut=playhead;trimIn=Math.min(trimIn,trimOut);render();});
$('trim-in').addEventListener('change',()=>{trimIn=Math.max(0,Math.min(trimOut,Number($('trim-in').value)*1000||0));render();});
$('trim-out').addEventListener('change',()=>{trimOut=Math.max(trimIn,Math.min(devices[deviceIndex].total,Number($('trim-out').value)*1000||0));render();});
$('record').addEventListener('click',()=>{recording=!recording;if(recording){playhead=0;selected=0;trimIn=0;trimOut=0;playing=true;actionFrames=false;$('action-frames').checked=false;}else{playing=false;trimOut=playhead;}render();});
// Playback merely advances mock states. Download intentionally has no handler.
setInterval(()=>{if(!playing)return;playhead=Math.min(devices[deviceIndex].total,playhead+200);if(recording)trimOut=playhead;if(playhead>=devices[deviceIndex].total){playing=false;recording=false;}render();},200);
render();
</script>
</body>
</html>
