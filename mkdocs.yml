# Public documentation site. Build with scripts/build-docs.sh. It generates
# the Kotlin, Python, and gRPC references before the hand-written pages.
site_name: Tap
site_description: >-
  Host-driven end-to-end testing for Android, in Kotlin or Python: one server
  per machine, a separate on-device driver, thin JUnit 5 and pytest clients.
site_author: Noam Cohen
site_url: https://noamcohen48.github.io/tap/
repo_url: https://github.com/NoamCohen48/tap
repo_name: NoamCohen48/tap
copyright: Copyright &copy; 2026 Noam Cohen. Licensed under the Apache License 2.0.
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/site
strict: false
# Theme overrides (the Markdown button and link on every page) live beside the pages.
exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  logo: assets/logo-header.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-4, name: Light mode}

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NoamCohen48/tap
      name: Tap on GitHub

extra_css:
  - stylesheets/brand.css

# Highlighting for ```console blocks: commands, refs, snapshot nodes, diffs and errors.
hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.highlight: {anchor_linenums: false, pygments_lang_class: true}
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # Screenshots open full size on click.
  - glightbox:
      skip_classes: [no-lightbox]
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [clients/python]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            # Types in signatures link to their entries on the other reference pages.
            signature_crossrefs: true
            # Each class opens with a table of its methods, linked to their entries.
            summary:
              functions: true
            members_order: source
            docstring_style: google
            show_attribute_values: false
            show_root_full_path: false
            show_labels: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            # Internal plumbing (gRPC stubs, deadlines, the owning connection) stays out of the
            # reference; Device.client is filtered in docs/reference/python/device.md.
            filters:
              - "!^_"
              - "!^pb$"
              - "!^(owner_connection|attached_device_id|channel|client_connections|device_stub|apps)$"
              - "!^(RPC_DEADLINE_SLACK|INSTALL_CHUNK_BYTES|FAILURE_TRAILER|FIRST_EVENT_TIMEOUT|MAX_EVENTS)$"
              - "!^pytest_"
            show_if_no_docstring: true

nav:
  - Home: index.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Download: download.md
      - The tap server: guide/server.md
      - Finding elements:
          - Selectors: guide/selectors.md
          - App or screen: guide/app-or-screen.md
      - Acting and waiting:
          - Elements and text: guide/elements.md
          - Gestures: guide/gestures.md
          - Waits: guide/waits.md
          - Keys, screen and rotation: guide/device-control.md
      - Apps and the device:
          - App lifecycle: guide/app-lifecycle.md
          - Permissions: guide/permissions.md
          - Device conditions: guide/device-conditions.md
          - Notifications and toasts: guide/notifications.md
          - Files and the gallery: guide/files.md
      - Tests:
          - Multi-device tests: guide/multi-device.md
          - Errors: guide/errors.md
          - Screenshots and artifacts: guide/artifacts.md
      - Coming from Maestro or Appium: guide/coming-from.md
      - App Explorer (experimental): guide/explorer.md
  - SDKs:
      - sdk/index.md
      - Python + pytest: sdk/python.md
      - Kotlin + JUnit 5: sdk/kotlin.md
      - API reference:
          - Python:
              - reference/python/index.md
              - Device: reference/python/device.md
              - Element: reference/python/element.md
              - Selectors: reference/python/selectors.md
              - App: reference/python/app.md
              - Screen: reference/python/screen.md
              - Client and connections: reference/python/client.md
              - Artifacts: reference/python/artifacts.md
              - Values: reference/python/values.md
              - Enums: reference/python/enums.md
              - Snapshots and the event log: reference/python/snapshots.md
              - Errors: reference/python/errors.md
              - pytest plugin: reference/python/pytest.md
          - Kotlin: reference/kotlin.md
  - tap-agent:
      - agent/index.md
      - A session, step by step: agent/session.md
      - Sessions to tests: agent/export.md
      - Commands: agent/commands.md
  - Tap Studio:
      - studio/index.md
      - A first recording: studio/first-recording.md
      - The page: studio/page.md
      - Steps and export: studio/steps.md
  - tap-watcher:
      - watcher/index.md
      - The Live view: watcher/live.md
      - Clips, recordings and the Library: watcher/library.md
  - Reference:
      - reference/index.md
      - gRPC server API (tap.v1): reference/grpc.md
      - Releases and versions: reference/releases.md
  - Development:
      - development/index.md
      - Architecture: development/architecture.md
      - Building and testing: development/building-and-testing.md
      - Project:
          - Changelog: https://github.com/NoamCohen48/tap/blob/main/CHANGELOG.md
          - Contributing: https://github.com/NoamCohen48/tap/blob/main/CONTRIBUTING.md
          - Code of conduct: https://github.com/NoamCohen48/tap/blob/main/CODE_OF_CONDUCT.md
          - Security: https://github.com/NoamCohen48/tap/blob/main/SECURITY.md
          - Releases: https://github.com/NoamCohen48/tap/releases
